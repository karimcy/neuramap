<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Results — OpportunityMap · Neura Energy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<link rel="icon" type="image/png" href="assets/neura-mark.png">
<link rel="stylesheet" href="css/app.css?v=21">
<link rel="stylesheet" href="css/results.css?v=21">
</head>
<body class="results-page">

<header id="rTop">
 <div class="rt-brand">
  <img src="assets/neura-wordmark-white.png" alt="Neura Energy" height="18">
  <span class="rt-title">Results — opportunity screen &amp; pipeline</span>
 </div>
 <nav class="rt-nav">
  <a href="index.html">← Map</a>
  <button class="chip-btn" id="rExport">Export filtered CSV</button>
  <button class="crm-btn" id="crmBtn">
   <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><rect x="3" y="7" width="10" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
   CRM login
  </button>
 </nav>
</header>

<div id="crmModal" hidden>
 <div class="crm-backdrop"></div>
 <div class="crm-card" role="dialog" aria-modal="true" aria-label="CRM login">
  <button class="crm-close" id="crmClose" aria-label="Close">✕</button>
  <img class="crm-logo" src="assets/neura-wordmark-white.png" alt="Neura Energy" height="22">
  <div class="crm-title">Pipeline CRM</div>
  <p class="crm-sub">Sign in to your Neura workspace</p>
  <form id="crmForm" autocomplete="off">
   <label class="crm-lbl" for="crmUser">Email</label>
   <input class="r-input" id="crmUser" type="email" placeholder="you@company.com" required>
   <label class="crm-lbl" for="crmPass">Password</label>
   <input class="r-input" id="crmPass" type="password" placeholder="••••••••" required>
   <button class="crm-submit" type="submit">Sign in</button>
  </form>
  <p class="crm-note" id="crmNote" hidden></p>
 </div>
</div>

<div id="rWrap">
 <aside id="rFilters">
  <div class="card">
   <div class="card-title">Screen settings</div>
   <div class="inline-ctl"><span class="lbl">Target load</span>
    <div class="seg seg-sm" id="rTarget">
     <button data-mw="20">20</button><button data-mw="50" class="on">50</button>
     <button data-mw="100">100</button><button data-mw="250">250</button>
    </div><span class="lbl">MW</span>
   </div>
   <div class="inline-ctl"><span class="lbl">Battery</span>
    <div class="seg seg-sm" id="rDur"><button data-h="2">2 h</button><button data-h="8" class="on">8 h</button></div>
   </div>
  </div>

  <div class="card">
   <div class="card-title">Filters</div>
   <input id="rSearch" class="r-input" placeholder="Search name / operator / region…">
   <div class="f-group"><span class="lbl">Type</span>
    <div class="seg seg-sm" id="rType">
     <button data-t="all" class="on">All</button><button data-t="node">Grid nodes</button><button data-t="asset">Assets</button>
    </div>
   </div>
   <div class="f-group"><span class="lbl">Markets</span><div id="rMarkets" class="chips"></div></div>
   <div class="f-group"><span class="lbl">Fit tier (nodes)</span><div id="rTiers" class="chips">
    <button class="fchip on" data-v="prime">prime</button><button class="fchip on" data-v="strong">strong</button>
    <button class="fchip" data-v="possible">possible</button><button class="fchip" data-v="weak">weak</button>
   </div></div>
   <div class="f-group"><span class="lbl">Asset status</span><div id="rStatus" class="chips">
    <button class="fchip on" data-v="Operational">operational</button>
    <button class="fchip on" data-v="Under Construction">construction</button>
    <button class="fchip on" data-v="Awaiting Construction">consented</button>
    <button class="fchip" data-v="Application Submitted">in planning</button>
    <button class="fchip on" data-v="Registered">registered (FR)</button>
   </div></div>
   <div class="f-group"><span class="lbl">Asset tech</span><div id="rTech" class="chips">
    <button class="fchip on" data-v="battery">battery</button><button class="fchip on" data-v="hybrid">hybrid</button>
    <button class="fchip" data-v="solar">solar</button>
   </div></div>
   <div class="f-group inline-ctl"><span class="lbl">Min MW</span>
    <input id="rMinMw" class="r-input r-num" type="number" value="0" min="0" step="5">
   </div>
   <label class="tog"><input type="checkbox" id="rMeasured"><span class="tog-ui"></span>Measured profile only</label>
   <label class="tog"><input type="checkbox" id="rPinned"><span class="tog-ui"></span>In pipeline only</label>
  </div>

  <div class="card" id="rStats"></div>
 </aside>

 <main id="rMain">
  <div id="rTableWrap">
   <table id="rTable">
    <thead><tr id="rHead"></tr></thead>
    <tbody id="rBody"></tbody>
   </table>
   <div id="rPager"></div>
  </div>
 </main>

 <aside id="rDetail" hidden></aside>
</div>

<script src="js/data.js?v=21"></script>
<script src="js/results.js?v=21"></script>
<script>
/* CRM login teaser — no backend yet; the modal exists to signal where this product goes */
(function () {
  const modal = document.getElementById('crmModal');
  const open = () => { modal.hidden = false; setTimeout(() => document.getElementById('crmUser').focus(), 0); };
  const close = () => { modal.hidden = true; };
  document.getElementById('crmBtn').onclick = open;
  document.getElementById('crmClose').onclick = close;
  modal.querySelector('.crm-backdrop').onclick = close;
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modal.hidden) close(); });
  document.getElementById('crmForm').onsubmit = e => {
    e.preventDefault();
    const n = document.getElementById('crmNote');
    n.hidden = false;
    n.classList.add('on');
    n.innerHTML = '<b>Sign-in isn’t live yet.</b> CRM workspaces open with the first customer accounts — ' +
      'your pipeline and notes stay saved in this browser and will sync once your workspace is provisioned.';
  };
})();
</script>
<script>
window.goatcounter = {
  path: function (p) { return location.hostname + p; }
};
</script>
<script data-goatcounter="https://neuramap.167.233.192.214.sslip.io/stats/count"
        async src="https://neuramap.167.233.192.214.sslip.io/stats/count.js"></script>
</body>
</html>
