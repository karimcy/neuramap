    notes: Perfect-foresight haircut — must be calibrated/versioned (M7); no confidence asserted yet.
  p90_revenue_haircut_contracted_pct:
    value: null
    unit: percent
    source: >-
      NO CITABLE GB SOURCE IDENTIFIED — the search is recorded here rather than closed with an
      invented number (D45 as amended 2026-08-12). (1) docs/bess_constants_register.md, the repo's
      422-constant sourced survey, holds no P50->P90 haircut for contracted revenue: its only
      P50/P90-adjacent rows are ancillary CLEARING-PRICE percentiles (DC/DM/DR/SFFR p10/median/p90
      in GBP/MW/h, NESO EAC auction results accessed 2026-08-11), which are merchant PRICE
      distributions and not a contracted-revenue delivery shortfall; its DSCR-by-revenue-structure
      row is annotated by the register itself "LOW AUTHORITY and NOT GB … No authoritative GB
      source published DSCR levels for storage during this survey"; and it warns that Modo Energy's
      Low/Central/High scenarios "represent different market outlooks rather than probabilistic
      percentiles" and "must not be relabelled as such". (2) Fresh web pass 2026-08-15, three
      queries — "GB battery storage project finance P50 P90 revenue haircut contracted availability
      revenue percentage"; "NESO Capacity Market delivery performance statistics battery
      non-delivery rate published GB 2026"; "Ofgem OR NESO published P90 downside contracted
      flexibility revenue percentile GB storage lender". Returned only a generic ~9% P50->P90
      figure from a non-GB SOLAR-YIELD blog (wrong asset class and market), the same US
      project-finance blog the register already rated LOW AUTHORITY / NOT GB, and GB BM SKIP rates
      (batteries ~49% H1-2025 falling to ~38% H1-2026, NESO/Modo) — skip is non-acceptance of
      MERCHANT volume in the Balancing Mechanism and applying it to contracted availability revenue
      would be a category error. No GB authority (NESO, Ofgem, ENA, DESNZ) publishes a scalar
      P50->P90 haircut for contracted revenue. None of the above is upgraded to a source.
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-15
    notes: >-
      EMPTY HOME, NEVER A ZERO. The CONTRACTED-firmness P90 revenue haircut (W8 slice 3). Consumer:
      src/gridq/finance/cashflows.py::_contracted_haircut_pct (defined :1238, called :1466), which
      reads this key when a release carries a usable value and otherwise returns the MERCHANT
      haircut (p50_p90_haircuts.p90_revenue_haircut_pct, 15.0) with a loud
      shares-the-merchant-haircut warning. A null value takes exactly that same branch, so this
      entry can never read as 0% (0% would mean contracted revenue is treated as FIRM, an outright
      P90/DSCR overstatement) and adding it moves no priced number. WHAT WOULD SETTLE IT: a GB
      empirical distribution of realised-vs-contracted annual revenue for BTM battery availability
      contracts, or — preferably, per D-89/D-139 — a per-stream calibration: CM delivery/
      Satisfactory-Performance-Day statistics for CAPACITY_MARKET; observed lower-decile award
      probability and utilisation rate for LOCAL_FLEX_PICLO (D-1410 gives P50 utilisation 0.05
      NGED SAOU_DA / 0.22 UKPN SAOU with P90 at 0.00-0.02, but no award-probability decile); and
      seasonal acceptance history for DFS. TWO CONSTRAINTS ON ANY VALUE LANDED HERE. (1) DO NOT
      DOUBLE-COUNT AVAILABILITY: the consumer sums this key with fleet unavailability into one
      shortfall (shortfall_fraction = contracted_haircut/100 + (1 - availability_factor)), and
      availability.fleet_availability_pct already ships at 95.0, so a value derived from outage or
      availability statistics charges the same 5% twice — this key must capture only the RESIDUAL
      contracted shortfall on top of unavailability. (2) A SCALAR IS THE WRONG SHAPE: D-225 and
      D-235 (docs/bess_modelling_requirements.md) both hold that a flat percentage haircut
      "produces a P90 that is not a percentile of anything", and D-139 requires DNO-flex P90 at or
      near zero, so one number cannot serve a 15-year CM agreement and a 90-day-terminable DSO
      award simultaneously. Until it is populated, the merchant fallback is CONSERVATIVE for
      CAPACITY_MARKET (a firm availability payment charged the full merchant price haircut) and
      OPTIMISTIC for in-term LOCAL_FLEX_PICLO / DFS (D-139 wants ~0, the fallback gives 85%);
      post-expiry those two are already forced to zero in P90 by cashflows.py::_NO_P90_AFTER_EXPIRY
      (D-130), which is a separate and already-live mechanism. Deriving a published GB value would
      be sourcing; there is none, so this stays null and the gap is declared.

