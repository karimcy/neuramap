battery_opex:
  annual_fixed_opex:
    value: 12000
    unit: GBP/MW/yr
    source: "VALUE UNCHANGED from gb_v0_1; BASIS REPLACED in gb_v1_8 (was 'no citable source identified'). Bracketed by two published sources with the coverage of THIS key (pure fixed O&M, excluding insurance / business rates / metering / DNO costs, which this library books separately): (a) FLOOR — PNNL, 'Energy Storage Grand Challenge Cost and Performance Assessment 2022' (PNNL-33283), August 2022, Figure 4.3, https://www.pnnl.gov/sites/default/files/media/file/ESGC%20Cost%20Performance%20Report%202022%20PNNL-33283.pdf — Li-ion LFP fixed O&M $3.17/kW-yr for a 1 MW 2h system ($5.05 at 4h; 2021 USD, ~£2,500-4,000/MW/yr at 0.79 GBP/USD), scope = minor maintenance plus amortised power-equipment refurbishment ONLY (0.43% of direct capital + 30% of power equipment every 10 years); (b) CEILING (decomposed) — Gresham House Energy Storage Fund AR2025 implied ALL-IN opex £24,600/MW/yr (2025, GB grid-scale; see annual_fixed_opex_grid_scale_benchmark) MINUS the fixed lines this library books separately (RE-STATED FOR gb_v1_11, where metering_idno and dno_costs are now ZERO and capex is £700k/MW: ~£11,500/MW/yr at 1 MW = business_rates 8,000 + insurance 0.5% x 700k = 3,500 + metering_idno 0 + dno_costs 0; it was ~£13,200/MW/yr on gb_v1_10) = ~£13,100/MW/yr for O&M + land rent + optimiser fees + portfolio operating costs at grid scale. Fetched/derived 2026-08-12."
    status: needs_review
    owner_or_reviewer: Oli
    confidence: low
    last_reviewed: 2026-08-17
    notes: >-
      Pure fixed O&M; excludes energy/levy costs (dispatch-driven) AND the separately-booked fixed
      lines (business_rates, insurance, metering_idno, dno_costs — adding any of them here
      double-counts). FINDING THAT DIVERGES FROM THE REMEDIATION BRIEF, stated plainly: the brief
      framed this key as '~2x optimistic' against the £24.6k grid-scale benchmark, but that
      comparison sets an ALL-IN figure against a PURE-O&M key. Decomposed, the library's own all-in
      at 1 MW is 12,000 + 11,500 = £23,500/MW/yr on gb_v1_11 — within 4.5% of the Gresham £24,600,
      having been 12,000 + 13,200 = £25,200 (within 2.5%) on gb_v1_10 — and 12,000
      sits between the PNNL narrow-scope floor (~£2.5-4k) and the decomposed Gresham residual
      (~£13.1k on gb_v1_11, ~£11.4k on gb_v1_10, which still includes land rent and optimiser fees
      that a BTM host-sited, aggregator-cut-separately asset may not bear). So the VALUE IS KEPT,
      not tuned in either direction; what was a bare placeholder is now a bracketed, cited estimate.
      DIRECTION OF EFFECT IN gb_v1_11: NONE — the value did not move. What moved is the decomposition
      the bracket is computed from: zeroing metering_idno and dno_costs and raising capex 40% shifts
      the separately-booked lines from ~£13,200 to ~£11,500/MW/yr, which RAISES the residual ceiling
      this key is bracketed against from ~£11.4k to ~£13.1k. The value is re-stated rather than
      re-tuned: nothing published was found this session that improves on the bracket, and moving a
      number because its bracket widened would be tuning, not sourcing. THE REGISTER'S
      CAVEAT STILL POINTS UP, unquantified: a 0.1-5 MW BTM site loses grid-scale economies
      (call-out costs, per-site telecoms, small-contract O&M pricing), so the true figure is likelier
      above than below 12,000 — nothing published quantifies the small-scale premium (search
      2026-08-12: NREL ATB commercial FOM 2.5% of capex is NOT usable here — it explicitly includes
      battery augmentation/replacement to hold rated capacity, which this library prices separately
      via battery_opex.degradation_marginal_cost_gbp_per_mwh; using it would double-count
      degradation). WHAT WOULD SETTLE IT: one real BTM C&I O&M contract quote (£/yr, stated scope)
      at 0.1-1 MW scale.
