    notes: >-
      ALL 14 GB licence areas now carry their own sourced 2026/27 CDCM band windows (LIT-F-05
      remediation under D45). THE VARIATION IS MATERIAL AND CANNOT BE PROXIED: red windows are
      16:00-19:00 (NGED EM/WM, UKPN EPN/SPN, SHEPD, ENWL), 16:00-19:30 (NPg both), 16:30-19:30
      (SEPD, SPEN both), 17:00-19:00 (NGED SW), 17:00-19:30 (NGED S Wales), and LPN has TWO red
      windows (11:00-14:00 and 16:00-19:00 — 6 red hours/day); SEVEN areas have AMBER at weekends
      (SEPD 09:30-21:30, SHEPD 12:00-20:00, SPD/SPM 16:00-20:00, NGED SW 16:30-19:30, NGED SWALES
      12:00-13:00 and 16:00-21:00 with a green gap, ENWL 16:00-19:00) while the rest are all-green
      weekends. BANK HOLIDAYS ARE RED in every sourced area — each statement prints 'Monday to
      Friday (Including Bank Holidays)' on the weekday row; treating them as green remains 'a
      common modelling error' (register). The EHV/EDCM Super Red band (Nov-Feb, NGED areas
      excluding 22 Dec-4 Jan where printed) applies to EHV sites only and is carried where the
      statement's Annex 2 was transcribed; its absence on UKPN/SPEN/NPg/SHEPD/ENWL entries means
      'not transcribed', not 'none'. Times are UK CLOCK TIME (Europe/London), not UTC — a
      UTC-indexed half-hourly series is off by one hour through BST. Keys follow the in-repo
      `dno_region` convention (NGED_EM, NGED_WM, NGED_SW, SSEN_SEPD are seen in examples/real);
      `connection.dno_region` is a free `str | None` with no enum (src/gridq/schemas/connection.py:23),
      so the identifiers not yet seen in any in-repo site MUST be reconciled against ingestion's
      actual values before the lookup is trusted. Effectivity (charging_year, effective_from) is
      carried INSIDE `value` because `Assumption` forbids sibling fields; the whole nested shape is
      a CONVENTION, unvalidated by the schema. Statements are re-issued in-year (UKPN v1.6/v1.3,
      NPg v0.3, SHEPD v1.1) — the in-year revisions inspected touched Annex 2/5/6 only, and every
      statement states 'We have not issued a notice to change the time bands'. RE-FETCH EACH
      CHARGING YEAR.
