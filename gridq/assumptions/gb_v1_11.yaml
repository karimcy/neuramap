business_rates:
  annual_gbp_per_mw:
    value: 8000
    unit: GBP/MW/yr
    source: "VALUE UNCHANGED and still not sourceable; the LIABILITY QUESTION IS RESOLVED ON THE LAW in gb_v1_11 (2026-08-17). The £/MW remains a VOA rateable value for BESS x the gov.uk non-domestic multiplier - the multiplier is a public constant (register: England 2026/27 non-RHL 0.430 / 0.480 / 0.508; decapitalisation 2.6 pct and 4.4 pct; AVD 1 April 2024; BESS carries Special Category Code 733, valued on the contractor's basis) but the RV is a specialist valuation and the VOA publishes NO £/MW or £/kW rateable-value scheme for BESS (VOA, 'Rating Manual section 5a: valuation of all property classes - Power generators', last updated 11 August 2026, WebFetched 2026-08-17: confirms SCat 733 and the method, publishes no rate). WHAT IS NOW SOURCED IS WHETHER THE LINE APPLIES AT ALL. The Valuation for Rating (Plant and Machinery) (England) (Amendment) Regulations 2022, SI 2022 No. 405, made 29 March 2022, in force 1 April 2022, https://legislation.gov.uk/uksi/2022/405/pdfs/uksi_20220405_en.pdf (fetched and text-extracted 2026-08-17), regulation 2(b), exempts 'excepted renewables plant and machinery', defined as plant and machinery used for 'the generation, storage, transformation or transmission of power where the sources of energy or technologies relied upon are mainly or exclusively - (i) biomass; (ii) biofuels; (iii) biogas; (iv) fuel cells; (v) photovoltaics; (vi) water (including waves and tides); (vii) wind; (viii) solar power; (ix) geothermal; (x) heat from air, water or the ground', and separately 'excepted EVCP plant and machinery' for an electric vehicle charging point, in each case 'in relation to any day before 1st April 2035'. The Explanatory Memorandum, para 7.2, quotes the Business Rates Review: an exemption for eligible plant and machinery used in onsite renewable generation and storage, 'such as rooftop solar panels and battery storage used with renewables', and para 7.4 confirms the 'mainly or exclusively' test. SO: a battery charged mainly or exclusively from ON-SITE RENEWABLES, or serving an EV charging point, is EXEMPT to 31 March 2035 and its rates line is £0; a GRID-CHARGED battery - the priced-floor case for these sites - is NOT exempt, because the grid mix is not 'mainly or exclusively' any listed source, and this placeholder stands for it. Wales arrived at the exemption by a separate route and a later date (Welsh Government consultation material proposes from 1 April 2024) and must not be assumed identical. Small Business Rate Relief is NOT available: gov.uk, 'Apply for business rate relief - Small business rate relief' (WebFetched 2026-08-17) requires that no other property has an RV above £2,899 and that the total RV of all properties is under £20,000, which multi-site commercial hosts fail on their existing premises alone. Fetched 2026-08-17."
    status: needs_review
    owner_or_reviewer: Oli (confirm treatment)
    confidence: low
    last_reviewed: 2026-08-17
    notes: >-
      DIRECTION OF EFFECT IN gb_v1_11: NONE. The value is unchanged at £8,000/MW/yr and the £ line
      is unchanged at every size (£800/yr at 100 kW). What changed is that the LAW behind it is now
      sourced on the key, so a reader can see which sites the line applies to and which it cannot.
      Business-rates treatment of BTM BESS must still be confirmed before it silently flatters every
      quote. The £/MW depends on a VOA rateable value (a specialist valuation) x the published
      multiplier: the multiplier is a public constant, the RV is not, and the VOA publishes no £/MW
      or £/kW scheme for BESS, so the £/MW stays a placeholder and no replacement number is invented
      here. Whether a behind-the-meter battery forms a SEPARATE HEREDITAMENT or merges into the
      host's assessment is unresolved in published guidance, and the consequence is material: if it
      merges, this £8,000/MW/yr may be a cost the HOST bears and the project never sees, in which
      case charging it to the project double-counts against a host who is also being sold the
      savings. That is a contract question, not a valuation question.
      THREE THINGS THE SOURCED LAW SETTLES. (a) A battery charged MAINLY OR EXCLUSIVELY from on-site
      renewables, or serving an EV charging point, is EXEMPT to 31 March 2035 by statute
      (SI 2022/405) and its correct value is £0 - worth £800/yr at 100 kW. (b) A GRID-CHARGED battery
      is genuinely rateable and this placeholder stands for it. (c) SMALL BUSINESS RATE RELIEF IS NOT
      A LIVE MITIGANT for these hosts and should stop being treated as one: the 'no other property
      above £2,899 RV' and 'total RV under £20,000' tests fail on a multi-site waste operator's or a
      science campus's existing premises before the battery is considered.
      ONE LIVE PER-SITE QUESTION, FLAGGED AND DELIBERATELY NOT MODELLED: Knowl Hill is recorded in
      this repo as 92.1 pct self-supplied by LANDFILL GAS, and BIOGAS is limb (iii) of the exempted
      list. Whether landfill gas is 'biogas' for these Regulations is not defined in the instrument
      and is a rating surveyor's question, so it is recorded as a per-site DATA ASK and nothing in
      this release assumes the answer. If the answer is yes, that site's rates line is £0 rather than
      £8,000/MW/yr. Tanhouse and Colnbrook are private-wire EfW plus solar supplies and raise the
      same question. Modelling any of this without the surveyor's answer would be inventing an
      exemption, which is the opposite of sourcing.
      CONFIRMATION ASK: a rating surveyor's opinion, per site, on (i) whether the battery is a
      separate hereditament or merges into the host's, (ii) the rateable value on the contractor's
      basis at this scale, and (iii) whether the site's supply mix engages the SI 2022/405
      exemption.

