# GridQ assumption library - GB, v1.11  (release: gb_v1_11)
#
# SOURCED COST-CORRECTION RELEASE over gb_v1_10 (2026-08-17), decision D49. Every gb_v1_10 value is
# carried forward BYTE-IDENTICAL except the SIX values enumerated below, grouped under five headings
# (the capex correction moves three keys together); ONE reference key is added; no key is dropped and
# no key is renamed. Nothing becomes confirmed; every quote on this release stays
# not_bankable, by design.
#
# WHY THIS RELEASE EXISTS. Every priced candidate on all eight campaign sites has a non-positive P50
# cashflow in EVERY year, so finance/returns.py correctly refuses a project IRR. A literature pass on
# 2026-08-17 established two things at once: 54.5 pct of the 100 kW fixed cost stack was unsourced
# placeholder AND contradicted by the primary text of two DNO charging statements, and the capex those
# placeholders sit beside is 19-29 pct BELOW the only published GB benchmarks. Both corrections land
# here, in the same release, and the net effect at the 100 kW / 2 h reference is WORSE:
#
#     metering_idno 1,200 -> 0 GBP/site/yr                     MINUS 1,200 GBP/yr   (better)
#     dno_costs     1,500 -> 0 GBP/site/yr recurring           MINUS 1,500 GBP/yr   (better)
#     insurance knock-on, 0.5 pct of the higher capex          PLUS    100 GBP/yr   (worse)
#     capex 500k -> 700k GBP/MW, annualised 8.9 pct over 10 yr PLUS  3,103 GBP/yr   (worse)
#     NET at 100 kW / 2 h                                      PLUS    503 GBP/yr   (WORSE)
#
# THE NETTING IS STATED FIRST DELIBERATELY, AND THE SIZE DEPENDENCE WITH IT. The two removed lines are
# size-INVARIANT (cashflows.py charges them with no power_mw multiplier, so a 2 kW battery paid the
# same 2,700 GBP/yr as a 750 kW one) while the capex correction scales with size. So the release makes
# a small site BETTER and a large one WORSE, crossing over at about 84 kW at 2 h:
#
#      25 kW: fixed opex MINUS 2,675 GBP/yr, capital charge PLUS    776 GBP/yr -> NET MINUS  1,899
#      50 kW: fixed opex MINUS 2,650 GBP/yr, capital charge PLUS  1,551 GBP/yr -> NET MINUS  1,099
#     100 kW: fixed opex MINUS 2,600 GBP/yr, capital charge PLUS  3,103 GBP/yr -> NET PLUS     503
#     200 kW: fixed opex MINUS 2,500 GBP/yr, capital charge PLUS  6,205 GBP/yr -> NET PLUS   3,705
#     300 kW: fixed opex MINUS 2,400 GBP/yr, capital charge PLUS  9,308 GBP/yr -> NET PLUS   6,908
#     750 kW: fixed opex MINUS 1,950 GBP/yr, capital charge PLUS 23,270 GBP/yr -> NET PLUS  21,320
#
# (The fixed-opex deltas are EXACT, measured through finance.cashflows.build_cost_lines on both
# releases. The capital charge is an ILLUSTRATIVE annualisation of the capex delta at the register's
# CEPA/DESNZ mid hurdle rate for lithium BESS, 8.9 pct pre-tax real CPI over a 10-year life, capital
# recovery factor 0.155135; it is arithmetic on the capex change, NOT this model's own capital
# account, which is finance/'s to state.)
#
# Landing the two cost DELETIONS without the capex CORRECTION would have manufactured a positive IRR
# out of half a correction, on the favourable half - the same class of error as the placeholders being
# replaced. Apply both or neither. They are not equally well evidenced and the difference is recorded
# on each key: the deletions rest on the verbatim operative text of two DNO charging statements and a
# public-sector buying framework's published figure; the capex correction rests on ONE commercial
# blog, is labelled needs_review at low confidence, and its confirmation ask is one real installer
# quote for a 100-300 kW GB commercial system.
#
# ---------------------------------------------------------------------------------------------
# (1) metering_idno.annual_gbp_per_site   1200 -> 0    DIRECTION: DOWN (better)
# ---------------------------------------------------------------------------------------------
# The recurring BATTERY-INCREMENTAL metering cost is zero. LASER Energy publishes ~400 GBP/meter/yr
# for an EXISTING half-hourly supply - one third of the 1,200 this key carried - and that is a HOST
# SITE cost: a no-export behind-the-meter battery adds no boundary Metering System, it re-shapes the
# host's existing import MPAN. Elexon P375 exists BECAUSE settlement behind the boundary point
# otherwise cannot happen, and its trigger is BM/VLP participation, which is not on these sites'
# priced-floor basis. DESNZ's own storage cost taxonomy (EINAS 2025) puts metering in CAPEX and has no
# annual metering line at all. The conservative alternative - book the whole site's 400 GBP/yr against
# the project - is recorded on the key with its confirmation ask, and it is the number to use if the
# customer's MOP contract turns out to require a new MPAN.
#
# ---------------------------------------------------------------------------------------------
# (2) dno_costs.annual_gbp_per_site   1500 -> 0 RECURRING    DIRECTION: DOWN (better)
#     battery_capex.dno_assessment_and_design_one_off_gbp_per_site   NEW KEY, 1557, NOT CONSUMED
# ---------------------------------------------------------------------------------------------
# There is no such thing as a recurring per-site DNO operating charge for a BTM battery at an existing
# commercial site, and the primary text says so: NGED (South West), Statement of Methodology and
# Charges for Connection, June 2026, clause 6.4 - 'The cost of future operations, repairs and
# maintenance of the connection assets and our Distribution System is normally recovered through the
# on-going charges for use of system you pay as part of your quarterly or monthly electricity supply
# bill.' Anything above the Minimum Scheme is a CAPITALISED ONE-OFF (clauses 5.12 and 6.5), not an
# annual charge. So the 1,500 GBP/yr was either a double count of DUoS - which this library already
# prices separately, in the duos section - or a one-off connection fee entered in an annual field. The
# published one-off Assessment and Design charge for a generation connection over 50 kVA at LV is
# 1,557 GBP (same document, Section 7 Table D), within 4 pct of the 1,500 that was sitting in the
# annual slot. That is an observation, not a provenance claim: this key's provenance was recorded as
# 'No citable source identified'.
#
# THE ONE-OFF IS ADDED AS A KEY AND IS NOT YET CONSUMED BY ANY CODE PATH, AND THAT UNDERSTATES CAPEX.
# finance/cashflows.py has no per-site capex adder to read it (estimate_capex is per-MW and per-kWh
# only), and wiring one is a change to a file another lane holds today. Direction of the omission:
# capex is understated by 1,557 GBP per site, which FLATTERS every return. It is recorded here so the
# figure and its source exist, labelled REFERENCE ONLY - NOT CONSUMED, with the wiring filed as an
# open item rather than claimed as landed.
#
# ONE REAL RECURRING DNO COST MUST NOT BE LOST WITH IT: if the battery raises the site's agreed
# capacity (MIC/MEC), the DUoS CAPACITY charge rises. That is a genuine recurring cost and it belongs
# inside the duos lines, not in a flat per-site line. The register records 2025/26 DUoS capacity
# charges rising 108 pct on average (up to 246 pct in Northern Powergrid Northeast).
#
# ---------------------------------------------------------------------------------------------
# (3) battery_capex.installed_cost   500000 -> 700000 GBP/MW    DIRECTION: UP (worse)
#     battery_capex.installed_cost_gbp_per_kwh   175 -> 245 GBP/kWh
#     battery_capex.installed_cost_gbp_per_mw_power_component   150000 -> 210000 GBP/MW
# ---------------------------------------------------------------------------------------------
# The library's 500 GBP/kW all-in at 2 h is 19 pct BELOW the published GB GRID-SCALE 2 h benchmark
# (618 GBP/kW, Modo Energy 2025, already carried in this file as
# installed_cost_grid_scale_survey_benchmark) and 29 pct below the only attributable GB C&I
# behind-the-meter figure found (350 GBP/kWh = 700 GBP/kW at 2 h; Gridcog, 28 January 2025). Small BTM
# systems cost MORE per kW than grid scale, not less, because the fixed costs - grid connection,
# controls, commissioning - do not scale down. So the library was optimistic in the same direction at
# every size and most so at the smallest.
#
# WHAT WAS REJECTED, AND IT MATTERS MORE THAN WHAT WAS APPLIED. The 445-1,315 GBP/kWh range from
# Seward/Qadrdan/Jenkins (PSCC 2022) was WITHDRAWN by the researcher on inspection of the paper: the
# text says 'Domestic stationary BSS prices', the modelled system is 10 kW / 20 kWh (a school), and the
# reference behind the range is one installer's retail website accessed in 2021. Transferring it would
# have been a 7.5x error. The register row that paraphrased it as 'domestic/commercial' is corrected in
# the same change. This release moves capex by 40 pct, not by 150 pct, and the 40 pct is single-sourced.
#
# The DECOMPOSITION is scaled uniformly so it still reconciles at the 2 h reference:
# 210,000 + 2,000 kWh/MW x 245 GBP/kWh = 700,000 GBP/MW. The power/energy SPLIT is unchanged in ratio
# and remains a placeholder-grade derivation, not a published split - Gridcog's 350 GBP/kWh is an
# ALL-IN per-kWh figure at 2 h, so splitting it any other way would invent a component.
# 700,000 GBP/MW stays inside the file's own 300k-900k plausibility band, which is unchanged.
#
# ---------------------------------------------------------------------------------------------
# (4) financing.debt_gearing_pct   60.0 -> 50.0    DIRECTION: DOWN on debt quantum
# ---------------------------------------------------------------------------------------------
# 50 pct is the GB published notional: CEPA for DESNZ, 'Hurdle rate estimates for electricity sector
# technologies', 2025, section 4.4.5 - 50 pct central with sensitivities at 0/25/75 pct - already in
# docs/bess_constants_register.md. The 60 pct it replaces was an explicit placeholder with no source.
# NO PRICED FIGURE MOVES ON THE CAMPAIGN SITES, and the reason is worth recording: non-recourse
# project finance does not exist at this ticket size. The smallest observed GB BESS facility in the
# register is 42.7m GBP against assets costing 12.5k-375k GBP here, CEPA received NO investor survey
# responses for the return on debt on lithium BESS, and observed merchant tenors are 1-3 years against
# a 10-year asset. These sites underwrite UNLEVERED with the band adjusted (CLAUDE.md section 2), so
# this key is corrected for CORRECTNESS, never to make a DSCR appear.
#
# ---------------------------------------------------------------------------------------------
# (5) business_rates.annual_gbp_per_mw   VALUE UNCHANGED (8000); basis RESOLVED ON THE LAW
#     insurance.annual_pct_of_capex      VALUE UNCHANGED (0.5); search recorded
#     battery_opex.annual_fixed_opex     VALUE UNCHANGED (12000); its decomposition arithmetic
#                                        re-stated against the new fixed stack
# ---------------------------------------------------------------------------------------------
# Business rates: SI 2022/405 (in force 1 April 2022) exempts plant and machinery used for STORAGE
# where 'the sources of energy or technologies relied upon are mainly or exclusively' biomass,
# biofuels, biogas, fuel cells, photovoltaics, water, wind, solar, geothermal or ambient heat, or where
# used mainly or exclusively for an EV charging point, in each case to 31 March 2035. A GRID-CHARGED
# battery is therefore RATEABLE - the grid mix is not 'mainly or exclusively' any listed source - and
# the placeholder stands for the priced-floor case. Small Business Rate Relief is NOT available to
# these hosts and stops being treated as a mitigant. The VOA publishes no GBP/MW rateable-value scheme
# for BESS, so the number stays a placeholder with the search recorded. ONE LIVE PER-SITE QUESTION is
# flagged rather than modelled: Knowl Hill is recorded at 92.1 pct landfill-gas supply and biogas is
# limb (iii) of the exempted list, which could take that site's rates line to zero. It is a rating
# surveyor's question, it is a per-site DATA ASK, and NOTHING in this release assumes the answer.
#
# Insurance: no better source than the register's existing broker-marketing 0.5-3 pct band was found;
# the value stays on the LOWER bound with the direction (UP, unquantified for a sub-MW system) and the
# searches recorded. Note the LINE still rises 40 pct at every size, because it is a percentage of the
# corrected capex: 250 -> 350 GBP/yr at 100 kW.
#
# Opex: the value is deliberately NOT changed - the research found nothing that improves on the
# existing two-source bracket and re-litigating it would be tuning. But the bracket's own arithmetic
# moved with items (1)-(3), so it is re-stated on the key: the separately-booked fixed lines at 1 MW
# are now 8,000 + 3,500 + 0 + 0 = 11,500 GBP/MW/yr, the decomposed Gresham House residual is
# 24,600 - 11,500 = 13,100 GBP/MW/yr, and this library's all-in at 1 MW is 12,000 + 11,500 = 23,500
# against Gresham's 24,600 - within 4.5 pct, and 12,000 still sits between the PNNL narrow-scope floor
# (~2.5-4k) and that residual.
#
# ---------------------------------------------------------------------------------------------
# WHAT THIS RELEASE DOES NOT DO
# ---------------------------------------------------------------------------------------------
# It does not add the Capacity Market peak-period levy. That is the largest single finding of the same
# research pass - npower Business Solutions publishes a 'Capacity Mechanism Peak Rate' of
# 5.313-30.581 p/kWh charged only on 16:00-19:00 working-day November-February consumption, against a
# best modelled DUoS red-to-green spread of 6.415 p/kWh at these sites - and it CANNOT be landed as a
# library or site-data change alone: a time-windowed levy needs engine support, because a flat
# levies dict entry would charge the peak rate on every half hour of charging. It is another lane's
# work and it is recorded here so the omission is not mistaken for a judgement that the stream is
# worthless.
#
# It does not touch the three levy values that the same pass flagged as unsourced (BSUoS 0.013115
# matching no published tariff period, CfD_ILR 0.01 being round-number-shaped, NuclearRAB 0.004683
# with no source found). Those live in examples/real/sites/*.json, not in this library, and they are
# recorded as data asks in docs/bess_constants_register.md.
#
# EVERY RUN ID CHANGES ON THIS RELEASE, and that is correct rather than drift: the inputs changed.
# Packs published on gb_v1_10 are SUPERSEDED, never deleted.
#
