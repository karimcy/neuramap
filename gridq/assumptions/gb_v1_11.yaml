  target_equity_irr_pct:
    value: 12.0
    unit: percent
    source: "Neura business plan (source_docs/neura_plan.html): 'investors need 12–13%' (also '13%+' for an unproven asset class, compressing toward an '11% required return' as it matures)."
    status: needs_review
