#   - capacity_market.de_rating_by_auction_and_delivery_year: the missing 5h/5.5h bins RE-QUERIED
#     from the live NESO resource (never interpolated): 2029-30 T-4 0.5509/0.6052, 2026-27 T-1
#     0.6745/0.7329. Direction: none for the sites (all < 5h); closes a documented gap.
#   - penalties.cm_penalty_rate_fraction_of_clearing: 0.25 -> 0.0416667. The statute is unambiguous
#     and was read directly: SI 2014/2043 Sch 1 para 5(3) (current amended text, F17):
#     "PRN = PEzx x (1/24)". DIRECTION: THIS FLATTERS EVERY QUOTE with CM revenue (reduces the
#     bounded worst-case penalty line ~6x). It is corrected anyway because the primary legislation
#     is explicit; the caps (200% monthly / 100% annual) are unchanged and corroborated.
#   - battery_opex.annual_fixed_opex: VALUE UNCHANGED at 12,000, placeholder -> needs_review with a
#     real two-source basis. The "~2x optimistic" reading compared ALL-IN grid-scale opex against
#     this pure-O&M key: decomposed, Gresham 2025 £24.6k all-in minus the library's separately
#     booked fixed lines (~£13.2k/MW/yr at 1 MW) leaves ~£11.4k for O&M+land+optimiser, and PNNL
#     2022's narrow-scope LFP fixed O&M is ~£2.5k/MW/yr (1 MW, 2h) — 12,000 sits between, at the
#     conservative end. The register's BTM small-scale premium caveat still points UP, unquantified.
#   - ancillary_services.dfs_registered_unit_capacity_mw: zone_names closed — the official NESO
#     GeoJSON identifies the 12 DFS zones by NUMBER (Region 1..12); no names are published.
#   - ancillary_services.dfs_guaranteed_acceptance_price_gbp_per_mwh (NEW): definition (Rules v5.0:
#     applies to DFS TESTS, published administratively) + the £3,000/MWh winter-2022/23 anchor.
#   - tnuos.demand_residual_bands_gbp_per_day (NEW): the published 2026/27 band table (NESO Final
#     TNUoS Table 10), so the site's unavoidable fixed line is derivable from its TCR band.
#     Direction: raises the fixed (unavoidable) bill line for >231 kVA sites (band 4, not the
#     previously assumed band 2) — worse for the customer bill, no change to dispatchable value.
# STILL OPEN, SEARCH RECORDED (see each key's notes): aggregator revenue share (no GB platform
# publishes one), realised DC/DM/DR K distribution (not public), current post-Apr-2026 DFS GAP
# value, SPEN/NPg local-flex minimum offer sizes, availability.* D30 empty homes (by design), and
# — NEW IN gb_v1_9 — p50_p90_haircuts.p90_revenue_haircut_contracted_pct (see the header above).
#
# SCHEMA LIMITS (unchanged from gb_v1_7, verified then): `Assumption.value` is `Any` — nested
# per-region schedules are a CONVENTION documented in notes, not schema-validated; effectivity
# lives INSIDE `value`; new top-level sections require a model change. Per-DNO entries in
# duos.*_by_dno carry heterogeneous inner shapes FAITHFUL TO EACH DNO'S OWN PUBLICATION STRUCTURE:
# band-invariant unit rates + banded fixed charges (NGED, EPN, SPN, NPg, SPEN) vs band-varying
# unit rates (LPN, SEPD `by_tcr_band`) — a consumer MUST check `rate_structure` before reading.
#
# STATUS DISCIPLINE unchanged: 0 `confirmed` repo-wide, by design — a fetched public tariff is
# needs_review until a human confirms it against the site's own bill. No quote on this release may
# present as bankable, and the one key gb_v1_9 adds is `needs_review` with a NULL value, so the
# not-bankable posture is untouched. gb_v0_1..gb_v1_8 stay FROZEN for provenance; this is a new
# file, never an in-place edit (the D41 convention). Loaded via load_assumptions("gb_v1_9").
# Cutting it makes it latest_version(), so it becomes the CLI default. Checked before cutting:
# tests/test_assumptions_gb_v1_8.py::test_gb_v1_8_is_resolvable_and_never_the_superseded_default
# asserts an INDEX invariant rather than "v1_8 is newest" and stays green; the gb_v1_7 equivalent
# asserts `resolved >= "gb_v1_7"` (a STRING compare — green for gb_v1_9, but it will break on
# gb_v1_10 and should be moved to the index form then); tests/test_cli_run.py resolves
# latest_version() dynamically; and the demo golden is pinned to gb_v1_4, not to latest, so
# GOLDEN_QUOTE_HASH does not move. No priced figure moves anywhere: see DIRECTION OF EFFECT above.

metadata:
  market: GB
  version: gb_v1_11
  released: 2026-08-17
  currency: GBP
  notes: >-
    GB assumptions, gb_v1_11 (2026-08-17), decision D49. SOURCED COST-CORRECTION release over
    gb_v1_10. Carries EVERY gb_v1_10 value forward byte-identical except SIX changed values under five
    headings (the capex correction moves three keys together), ADDS ONE reference key, drops and
    renames nothing. (1) metering_idno.annual_gbp_per_site 1200 -> 0,
    DIRECTION DOWN, MINUS 1,200 GBP/site/yr at every size: the recurring battery-INCREMENTAL metering
    cost is zero because a no-export BTM battery adds no boundary Metering System, and the sourced
    host-site figure is ~400 GBP/meter/yr (LASER Energy), one third of what this key carried.
    (2) dno_costs.annual_gbp_per_site 1500 -> 0 RECURRING, DIRECTION DOWN, MINUS 1,500 GBP/site/yr:
    NGED South West clause 6.4 states that future DNO operation, repair and maintenance is recovered
    through use-of-system charges, which this library already prices separately, and anything above
    the Minimum Scheme is a capitalised ONE-OFF. The published one-off Assessment and Design fee for
    LV generation over 50 kVA, 1,557 GBP, is added as
    battery_capex.dno_assessment_and_design_one_off_gbp_per_site, REFERENCE ONLY and NOT CONSUMED by
    any code path - which UNDERSTATES capex by 1,557 GBP per site and therefore FLATTERS every
    return until it is wired. (3) battery_capex.installed_cost 500000 -> 700000 GBP/MW with the
    decomposition scaled uniformly (installed_cost_gbp_per_kwh 175 -> 245,
    installed_cost_gbp_per_mw_power_component 150000 -> 210000, reconciling at the 2 h reference),
    DIRECTION UP, WORSE: 500 GBP/kW at 2 h is 19 pct below the GB grid-scale benchmark and 29 pct
    below the only attributable GB C&I figure. This correction MORE THAN CANCELS (1) and (2) above
    about 84 kW: the two deleted lines are size-invariant while capex scales, so the release makes a
    25 kW site BETTER by 1,899 GBP/yr and a 750 kW site WORSE by 21,320 GBP/yr, and the 100 kW
    reference lands at PLUS 503 GBP/yr, i.e. worse. Every figure in that sentence is MEASURED through
    finance.cashflows.estimate_capex and build_cost_lines on both releases, with the capital charge
    an illustrative annualisation of the capex delta at 8.9 pct over 10 years (CRF 0.155135). Landing the deletions without the capex
    correction would have manufactured a positive IRR out of the favourable half of the evidence.
    (4) financing.debt_gearing_pct 60 -> 50, the CEPA/DESNZ published notional replacing an unsourced
    placeholder; NO priced figure moves, because non-recourse project finance does not exist at this
    ticket size (smallest observed GB facility 42.7m GBP against 12.5k-375k GBP assets) and these
    sites underwrite unlevered. (5) THREE keys keep their VALUE and gain their evidence:
    business_rates.annual_gbp_per_mw (SI 2022/405 exempts storage only where the sources are mainly
    or exclusively renewable, or for EVCP, to 31 March 2035, so a GRID-CHARGED battery is rateable
    and the placeholder stands; Small Business Rate Relief is not available to these multi-site
    hosts; the VOA publishes no GBP/MW RV scheme; and Knowl Hill's 92.1 pct landfill-gas supply
    raises a live biogas exemption question recorded as a per-site DATA ASK, not modelled),
    insurance.annual_pct_of_capex (no better source than the register's 0.5-3 pct broker band; the
    value sits on its lower bound and the LINE still rises 40 pct because capex did), and
    battery_opex.annual_fixed_opex (value untouched; its two-source bracket arithmetic re-stated
    against the new fixed stack: separately-booked lines at 1 MW now 11,500 GBP/MW/yr, all-in 23,500
    against Gresham House's 24,600). NOT IN THIS RELEASE, and recorded so the omission is not read as
    a judgement: the Capacity Market peak-period levy (published at 5.313-30.581 p/kWh on
    16:00-19:00 working-day Nov-Feb import) needs engine support for a time-windowed levy before any
    site data may carry it, and the three unsourced levy values live in the site records rather than
    here. EVERY run_id changes because the inputs changed; that is correct, not drift, and packs on
    gb_v1_10 are superseded rather than deleted. NOT confirmed - 0 confirmed repo-wide; no quote on
    this release is bankable. All prior releases stay frozen for provenance. Superseded gb_v1_10
    notes follow for lineage.
    GB assumptions, gb_v1_10 (2026-08-16). Carries EVERY gb_v1_9 value forward byte-identical
    except three enumerated changes, adds no key and drops no key. (1)
    capacity_market.de_rating_factor_by_duration_h is EXTENDED from the 1h/2h/4h slice to the FULL
    published 2029-30 T-4 storage curve at 0.5h resolution, 0.5h to 12h, taken from the same NESO
    CKAN resource d94ff98d-39ba-40d6-9672-7433de0631ac already cited on this key and already
    carried in full in this same file under de_rating_by_auction_and_delivery_year. No bin is
    interpolated or invented; the 1h/2h/4h bins are unchanged to the digit; the published 8.5h to
    12h plateau is written as discrete numeric bins at 0.9216 because both lookups parse keys as
    floats and a range key would make the table read as malformed, which prices CM at GBP 0.
    DIRECTION OF EFFECT on de-rated MW and therefore CM revenue: 0.5h MINUS 49.3 pct (0.1099 to
    0.0557, the branch that flattered, now corrected downward); 1h, 2h, 4h unchanged; 1.5h PLUS
    49.3 pct; 3h PLUS 50.0 pct; 6h PLUS 50.3 pct; 8h PLUS 99.7 pct. The upward moves are the
    larger half: they replace a floor-to-a-lower-bin approximation with the auction's own
    published bin, and they also remove a SELECTION bias, since the sizing search enumerates
    0.5h to 8h continuously and the objective optimises over duration. No published figure moves
    today: every persisted run prices CAPACITY_MARKET at 0.00 because all six live sites sit below
    the 1 MW reg 15 prequalification threshold. (2)
    penalties.cm_annual_cap_pct_of_revenue keeps its VALUE (100.0) and its status; its source and
    notes are corrected because the release previously asserted the 100 pct annual cap as an
    UNCONDITIONAL worst case. Under SI 2014/2043 Sch 1 para 6(2) and 6(2A) it binds only once a
    penalty charge has been incurred in at least 48 relevant settlement periods comprising at
    least 8 in each of at least 6 months of the delivery year; below that only the 200 pct monthly
    cap applies. Treating it as unconditional UNDERSTATES the worst case, so the present consumer
    treatment flatters P90 and DSCR; the fix is a code change outside this release and is recorded
    as an open item, not applied by relabelling a statutory percentage. (3)
    penalties.cm_penalty_rate_basis gains four additive fields recording that conditionality.
    NOT confirmed - 0 confirmed repo-wide; no quote on this release is bankable. All prior
    releases stay frozen for provenance. Superseded gb_v1_9 notes follow for lineage.
    GB assumptions, gb_v1_9 (2026-08-15). Carries EVERY gb_v1_8 value forward byte-identical and
    adds exactly ONE key: p50_p90_haircuts.p90_revenue_haircut_contracted_pct, with a NULL value
    and status needs_review. DIRECTION OF EFFECT: NONE — the consumer
    (finance/cashflows.py::_contracted_haircut_pct) treats a null value exactly as an absent key,
    returning the MERCHANT haircut with its shares-the-merchant-haircut warning, so no priced
    number moves and a null can never read as zero here. The value is empty because the search
    FAILED and D45 as amended forbids inventing one: the repo's own 422-constant register returned
    NO_SOURCE_FOUND for this class (its DSCR row is flagged LOW AUTHORITY / NOT GB, and it warns
    that vendor Low/Central/High scenarios are not percentiles), and a fresh three-query web pass
    on 2026-08-15 surfaced only a non-GB solar-yield example, the same US blog, and BM skip rates —
    a merchant non-acceptance statistic, not a contracted-revenue shortfall. Two caveats bind any
    future population, both recorded on the key: it must EXCLUDE fleet unavailability (already
    summed into the same shortfall via availability.fleet_availability_pct = 95.0, or the 5% is
    charged twice), and a single scalar is an INTERIM instrument per D-225/D-235/D-139, since one
    percentage cannot be right for a 15-year CM agreement and a 90-day-terminable DSO award at
    once. NOT confirmed - 0 confirmed repo-wide; no quote on this release is bankable. All prior
    releases stay frozen for provenance. Superseded gb_v1_8 notes follow for lineage.
    GB assumptions, null-closure release over gb_v1_7 (decision D45 as amended 2026-08-12: a null on
    the pricing path is a defect, not a state to report). Closes the 13 unsourced DNO licence areas
    in duos.band_windows_by_dno and duos.unit_rates_p_per_kwh_by_dno from each DNO's own 2026/27
    Use of System Charging Statement (final, effective 1 April 2026, fetched 2026-08-12 with URL and
    sha256 per area); adds the TCR residual band thresholds so a site's band is derivable from its
    agreed capacity; sets financing.cpi_pct_per_year from the OBR March 2026 EFO; closes the CM
    5h/5.5h de-rating bins by RE-QUERYING the live NESO resource (never interpolating); corrects the
    CM penalty rate to the statutory PE/24 read directly from SI 2014/2043 Sch 1 para 5(3) — a
    correction that FLATTERS quotes and is disclosed as such; re-sources the opex placeholder with a
    two-source reconciliation (value unchanged); closes DFS zone identifiers (numbered 1-12, no
    published names) and lands the DFS Guaranteed Acceptance Price definition with its winter-2022/23
    anchor; and lands the published TNUoS demand-residual band table. Keys a documented search could
    not close (aggregator revenue share, realised K, current DFS GAP value, SPEN/NPg minimum offer
    sizes) carry the recorded search in their notes and stay null — never read as zero on a priced
    path. NOT confirmed - 0 confirmed repo-wide; no quote on this release is bankable. All prior
    releases stay frozen for provenance.

battery_capex:
  installed_cost:
    value: 700000
    unit: GBP/MW
    source: "CORRECTED UPWARD in gb_v1_11 (2026-08-17), replacing the Neura business plan's own explicitly-indicative 'roughly £500k per MW' (source_docs/neura_plan.html). PRIMARY BASIS, and it is a single source: Gridcog, 'The economics of behind-the-meter battery storage. Part 1: Reducing your energy bill', 28 January 2025, https://www.gridcog.com/blog/the-economics-of-behind-the-meter-battery-storage-part-1-reducing-your-energy-bill - 'a battery capex of £350 per kWh' and 'the LCoS for a C&I battery of about 16p/kWh', worked on 'our example site for this exercise is a small supermarket in Maidstone, Kent that consumes 470MWh per year'. RE-VERIFIED BY DIRECT FETCH 2026-08-17 (Olly), independently of the research pass: 'based on a battery capex of £350 per kWh' and 'the LCoS for a C&I battery of about 16p/kWh' are both present verbatim. At the 2-hour reference this library uses, £350/kWh = £700/kW = £700,000/MW. The two figures reconcile internally (£350/kWh capex against a 16p/kWh LCoS), the source is GB-specific and explicitly C&I behind-the-meter, it is dated, and it is ALREADY an accepted citation in docs/bess_constants_register.md. It is nonetheless a software vendor's blog, not a survey or a primary document. DIRECTIONAL CORROBORATION, three ways, none of which fixes the magnitude: (a) Modo Energy, 'Modelling Assumptions' (UK/Europe, July 2026 vintage) puts a GB GRID-SCALE 2 h system at £618/kW in 2025 real prices, and Modo's November 2024 BESS CapEx Survey at £580,000/MW average with a £650,000/MW 2 h median - both already carried in this file under installed_cost_grid_scale_survey_benchmark, and both ABOVE the £500,000 this key held; (b) the fixed-cost dilution mechanism, stated in DESNZ/Carbon Trust EINAS 2025 and plainly by Reonic ('fixed costs like the grid connection and controls do not grow with capacity, so they weigh far more on a small system') - a sub-MW BTM system costs MORE per kW than grid scale, so a figure below the grid-scale benchmark is optimistic at every size and most so at the smallest; (c) Reonic, 'Commercial Battery Storage Cost: 2026 UK Guide' (installer guide, snippet only), 'roughly £200 to £450 per kWh installed'. EXPLICITLY REJECTED, recorded because rejecting it matters more than applying the 40 pct: the £445-1,315/kWh range in Seward/Qadrdan/Jenkins, PSCC 2022 paper 19890, is DOMESTIC retail pricing ('Domestic stationary BSS prices are higher, ranging from £445/kWh to £1315/kWh'), for a 10 kW / 20 kWh school system, referenced to one installer's website accessed in 2021. Transferring it would have been a 7.5x error. A SECOND independent GB C&I capex source was searched for and NOT FOUND (searches recorded in docs/bess_constants_register.md), so this correction is SINGLE-SOURCED. Fetched 2026-08-17."
    status: needs_review
    owner_or_reviewer: Olly (confirm with one real installer quote)
    confidence: low
    last_reviewed: 2026-08-17
    notes: >-
      DIRECTION OF EFFECT: UP, PLUS 40 pct, and it makes every site WORSE. At 100 kW / 2 h capex
      goes £50,000 -> £70,000; annualised at the register's CEPA/DESNZ mid hurdle for lithium BESS
      (8.9 pct pre-tax real CPI, 10-year life, capital recovery factor 0.155135) that is about
      +£3,103/yr, plus £100/yr of extra insurance at 0.5 pct of capex. This is the correction that
      MORE THAN CANCELS the metering_idno and dno_costs deletions in the same release above about
      84 kW at 2 h. IT IS LANDED WITH THEM ON PURPOSE. Taking only the favourable half of the
      evidence would have produced a positive IRR out of an incomplete correction, which is the same
      error class as the placeholders being replaced.
      THE CONFIDENCE IS LOW AND THE STATUS IS needs_review BECAUSE THE MAGNITUDE IS SINGLE-SOURCED
      ON A COMMERCIAL BLOG. Its DIRECTION is corroborated three ways (grid-scale benchmarks above,
      the fixed-cost dilution mechanism, an installer guide); its MAGNITUDE is not. CONFIRMATION
      ASK, and it is the cheapest high-value action in the whole cost stack: ONE real installer
      quote for a 100-300 kW GB commercial behind-the-meter system, £/kW installed at 2 h, stating
      what it includes (PCS, enclosure, EPC, DNO works, controls, commissioning). That single quote
      settles the largest open number in this model.
      £700,000/MW remains inside this file's own £300k-£900k plausibility band
      (installed_cost_benchmark_band, unchanged) and remains ABOVE the grid-scale survey average
      (£580,000/MW) and 2 h median (£650,000/MW), which is the right side of them for a sub-MW BTM
      site.
  installed_cost_benchmark_band:
    value:
      low: 300000
      high: 900000
    unit: GBP/MW
    source: "Internal plausibility band (L14 mechanism, 2026-06-24) — illustrative bounds, not a sourced market figure; confirm against a real capex benchmark library."
    status: placeholder
    owner_or_reviewer: Oli
    confidence: low
    last_reviewed: 2026-06-24
    notes: >-
      Plausibility band for installed capex (£/MW); an installer/modelled unit cost outside it is
      flagged for review (never blocks, never changes a figure). Illustrative placeholder bounds
      pending a real capex benchmark library.

  installed_cost_gbp_per_kwh:
    value: 245.0
    unit: GBP/kWh
    source: "SCALED UNIFORMLY in gb_v1_11 (2026-08-17) with the all-in correction on battery_capex.installed_cost (500,000 -> 700,000 GBP/MW; Gridcog, 28 January 2025, £350/kWh for a GB C&I behind-the-meter battery - full citation and its caveats are on that key). 175.0 x 1.4 = 245.0 keeps the decomposition reconciling to the corrected all-in at the 2-hour reference: 210,000 + 2,000 kWh/MW x 245 = 700,000 GBP/MW. The SPLIT between power and energy is NOT published and is not claimed to be: Gridcog's £350/kWh is an ALL-IN per-kWh figure at 2 h, so splitting it in any other ratio would invent a component. The prior basis - perimeter research recorded in docs/reviews/2026-07-03-capex-shape-research.md (BNEF ESS Cost Survey 2025: Europe turnkey avg US$177/kWh, 4h LFP installed US$180-260/kWh; NREL 2025 US$334/kWh upper anchor) - is retained here because it still brackets the figure: US$334/kWh at 0.79 GBP/USD is ~£264/kWh, so 245 sits inside the international band it was chosen from. Confirm against real installer quotes before ANY bankable use."
    status: placeholder
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-17
    notes: >-
      The ENERGY component of installed capex (C025): cells/racks/enclosures per kWh. When
      present alongside the power component, finance prices capex as power_component x MW +
      this x kWh, giving added duration real marginal capital cost - the wide-duration search
      stops pinning to the band edge. Releases without this key are byte-identical (all-in
      per-MW capex, duration unpriced).
      DIRECTION OF EFFECT: UP, PLUS 40 pct, WORSE, and it bites hardest on LONG durations because
      this is the per-kWh term: at 100 kW the capex delta is +£14,000 at 4 h against +£7,000 at 2 h.
      That also changes the SIZING SURFACE, not just the level: added duration now carries 40 pct
      more marginal capital cost, so the search should lean shorter than it did on gb_v1_10. Still a
      PLACEHOLDER-grade split of a single-sourced all-in figure - see the confirmation ask on
      battery_capex.installed_cost, which settles both components at once.
  installed_cost_gbp_per_mw_power_component:
    value: 210000.0
    unit: GBP/MW
    source: "PLACEHOLDER - the residual that reconciles the decomposition to the corrected all-in at the 2-hour reference, SCALED UNIFORMLY in gb_v1_11 (2026-08-17): 210,000 + 2,000 kWh/MW x GBP245/kWh = GBP700,000/MW (battery_capex.installed_cost, needs_review, sourced to Gridcog 28 January 2025 - see that key for the citation and its single-source caveat). 150,000 x 1.4 = 210,000. The 30/70 power/energy ratio is CARRIED FORWARD UNCHANGED and is still not a published split. Research basis for the shape: docs/reviews/2026-07-03-capex-shape-research.md."
    status: placeholder
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-17
    notes: >-
      The POWER component of installed capex (C025): PCS/inverter, balance of plant, EPC power
      share and grid connection, per MW. Consumed only together with
      installed_cost_gbp_per_kwh; the legacy all-in installed_cost stays as the fallback and
      the reconciliation anchor.
      DIRECTION OF EFFECT: UP, PLUS 40 pct, WORSE, and it is the size-proportional half of the
      capex correction - it lands on every candidate whatever its duration, where the per-kWh term
      lands hardest on the long ones. At 100 kW that is +£6,000 of the +£20,000 capex delta at 2 h.
      The 30/70 power/energy ratio is UNCHANGED and remains a placeholder-grade derivation: this key
      is still the residual that reconciles the decomposition to the all-in, so it carries no
      independent evidence of its own and moves only when installed_cost moves. See the confirmation
      ask on battery_capex.installed_cost, which settles both components at once.
  dno_assessment_and_design_one_off_gbp_per_site:
    value: 1557
    unit: GBP/site (one-off, at connection)
    source: "National Grid Electricity Distribution (South West) plc, 'Statement of Methodology and Charges for Connection to National Grid Electricity Distribution (South West) plc's Electricity Distribution System', June 2026, Section 7 Table D - minimum Assessment and Design charge, row verbatim: 'Connection of other generation greater than 50kVA at LV  £1,557  £1,557'. https://connections.nationalgrid.co.uk/downloads/229320/south-west-june-26-statement-of-methodology-and-charges.pdf (fetched and text-extracted 2026-08-17). The same document's clauses 5.12, 6.4 and 6.5 are the basis for dno_costs.annual_gbp_per_site being ZERO as a recurring line: 'The cost of future operations, repairs and maintenance of the connection assets and our Distribution System is normally recovered through the on-going charges for use of system' (6.4), and any above-Minimum-Scheme operation and maintenance 'would normally be levied as a one-off charge representing the net present value of the future operation and maintenance costs' (5.12). Neighbouring published minima from the same table, for scale: £193 for a single Small Scale Embedded Generator, £410 up to 20 kVA LV, £1,142 for 20-50 kVA LV, £1,960 up to 250 kVA at HV. Corroborated as a CATEGORY by Northern Powergrid (Northeast) plc, Connection Charging Methodology Statement, February 2024, which lists operations/repairs/maintenance as Non-Contestable Work the DNO performs and funds, with recurring O&M charges appearing only for Speculative Developments (para 5.49). Fetched 2026-08-17."
    status: needs_review
    owner_or_reviewer: Olly (per-site, from the actual connection offer)
    confidence: low
    last_reviewed: 2026-08-17
    notes: >-
      REFERENCE ONLY - NOT CONSUMED BY ANY CODE PATH TODAY, AND THE OMISSION FLATTERS EVERY RETURN.
      finance.cashflows.estimate_capex prices capex per MW and per kWh only; it has no per-site
      one-off adder, so this £1,557 does not enter capex, does not enter the capital account and
      does not enter any IRR. DIRECTION OF THE OMISSION: capex is UNDERSTATED by £1,557 per site,
      which is 12.5 pct of a 25 kW battery's corrected capex (£17,500) and 0.4 pct of a 750 kW
      one's - so it matters most exactly where the size-invariant lines this release deleted
      mattered most. Wiring a consumer is an open item against finance/cashflows.py and it is filed
      as one, NOT claimed as landed: this repo has shipped built-tested-never-called eleven times
      and a key nothing reads is not a fix.
      WHY IT IS HERE AT ALL, rather than left out: it is the one-off half of the dno_costs
      correction. That key carried £1,500/YEAR with no source; the published one-off fee for exactly
      these sites' connection category (>50 kVA LV generation) is £1,557, within 4 pct of it. That
