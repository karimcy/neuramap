    source: "Per-area 2026/27 Use of System Charging Statements / Schedules of Charges (final, effective 1 April 2026), each fetched 2026-08-12 and parsed deterministically from the downloaded file named per area (source_url + sha256 inside each area's block; UKPN rates parsed from the Schedule-of-charges workbooks whose Annex 1 is digit-identical to the LC14 statement PDFs; ENWL from the v1_1 workbook cross-checked digit-identical against the LC14 statement v1.0). NGED_EM carried byte-identical from gb_v1_7: NGED (East Midlands) plc, Notice of Charges effective 1 April 2026, Annex 1, December 2024, https://commercial.nationalgrid.co.uk/downloads-view-reciteme/684677, transcribed via docs/bess_constants_register.md."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      Paired with band_windows_by_dno: the £ of red-band avoidance is the WINDOW times the RATE, so
      a sourced window without a sourced rate is only half the constant. ALL 14 LICENCE AREAS NOW
      SOURCED (D45 closure of LIT-F-05). READ `rate_structure` BEFORE CONSUMING AN AREA — the DNOs
      publish two different shapes and this key carries each faithfully:
      band_invariant_units_with_banded_fixed (NGED all four, UKPN EPN/SPN, SPEN both, NPg both) has
      one {red, amber, green} set per tariff family plus fixed_p_per_mpan_day varying by TCR band;
      banded_units (UKPN LPN, SSEN SEPD) and banded_units_and_banded_fixed (SSEN SHEPD, ENWL) carry
      by_tcr_band sub-maps where THE UNIT RATES THEMSELVES vary by band — for those areas a site's
      TCR band must be known before a red rate can be read (thresholds:
      duos.tcr_band_thresholds_kva). Red rates span 5.471 (SEPD LV band 4) to 14.833 (NGED SW LV)
      p/kWh across areas for nominally the same LV HH tariff — a 2.7x cross-area range, which is
      why the gb_v1_7 cross-region proxy (NGED_EM rates on SEPD/WM sites) was a defect. The
      red-to-green spread falls materially from LV to HV in every area, so connection voltage
      changes the stream materially. NUMERICAL HAZARD (register): red GENERATION credits are close
      to (SEPD LV band-agnostic credit 8.447 vs No Residual import 8.530) or even EXCEED (NGED
      SWALES credit 12.886 vs import 12.885, as printed) the red IMPORT charge, so a MILP without a
      charge/discharge binary can exploit the near-equality and book a cycle that does not exist
      physically. Exceeded-capacity charges equal the capacity charge in every fetched area and are
      not carried separately. Fixed adders for the same band differ up to ~50x across areas (LPN
      band 4 LV 2.35 vs SPM 3592.14 p/MPAN/day) — never proxy a fixed line across areas either.
      Rates are re-fetched each charging year; do not hold flat (2025/26 context: overall DUoS -6%
      average but +25% to -32% regionally, capacity charges +108% average — Drax / NUS Consulting).
  tcr_band_thresholds_kva:
    value:
      boundary_rule: "Lower < x <= Upper (inclusive of the upper threshold, exclusive of the lower)"
      allocation_basis:
        hh_sites: "24 months average Maximum Import Capacity (MIC); initial allocation used July 2018 - July 2020"
        nhh_sites: annual consumption (kWh)
        domestic: not banded
        rebanding: "band can be changed if the criteria in DCUSA Schedule 32 are met"
      lv_site_specific: {band_1: [0, 80], band_2: [80, 150], band_3: [150, 231], band_4: [231, null]}
      lv_sub_site_specific: {band_1: [0, 80], band_2: [80, 150], band_3: [150, 231], band_4: [231, null]}
      hv_site_specific: {band_1: [0, 422], band_2: [422, 1000], band_3: [1000, 1800], band_4: [1800, null]}
      edcm: {band_1: [0, 5000], band_2: [5000, 12000], band_3: [12000, 21500], band_4: [21500, null]}
    unit: kVA (null upper bound = unbounded)
    source: "National Grid (WPD), 'Residual Banding — Amendments to Charging from April 2022' (guidance document, verbatim threshold table and boundary rule), https://commercial.nationalgrid.co.uk/downloads-view-reciteme/623467, fetched 2026-08-12; bands created by Ofgem, 'Targeted Charging Review: Decision and Impact Assessment', 21 November 2019, https://www.ofgem.gov.uk/decision/targeted-charging-review-decision-and-impact-assessment; distribution bands published by the ESO November 2020 per the Ofgem-approved methodology."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      THE MISSING LINK for both banded lookups (NEW in gb_v1_8): unit_rates_p_per_kwh_by_dno
      by_tcr_band entries and tnuos.demand_residual_bands_gbp_per_day are unreadable without
      knowing WHICH band the site is in, and these are the published national thresholds that
      derive it from agreed capacity. Same four-band structure applies to the TNUoS demand residual
      (the TCR created both; NESO Final TNUoS Table 10 uses the same LV1-4/HV1-4 labels). Two
      hazards: (1) the boundary is upper-INCLUSIVE, so exactly 231 kVA is band 3, not band 4;
      (2) the band reflects the 24-month average MIC and DCUSA Sch 32 re-banding history, so the
      site's BILLED band can differ from the band its current MIC implies — confirm against an
