  settlement_mechanics_by_product:
    value:
      availability_payment_formula: "AP_sm = sum_j ( AC_sj * AVP_sj * CC_sj * SA_sj ) * MPF_sm, with AC = availability price GBP/MW/h, AVP = availability period (minutes/60), CC = contracted capacity MW, SA in {0,1} (0 if declared or deemed unavailable)"
