# CAPACITY MARKET DE-RATING CURVE RELEASE over gb_v1_9 (2026-08-16). Every gb_v1_9 value is carried
# forward BYTE-IDENTICAL except the THREE enumerated below. Nothing becomes confirmed; every quote
# on this release stays not_bankable, by design.
#
# ---------------------------------------------------------------------------------------------
# (1) capacity_market.de_rating_factor_by_duration_h   VALUE EXTENDED, 3 bins -> 24 bins
# ---------------------------------------------------------------------------------------------
# gb_v1_9 carried {1h 0.1099, 2h 0.2198, 4h 0.4396}, which is the 1h/2h/4h SLICE of the published
# 2029-30 T-4 storage curve. The SAME release already carries the WHOLE published curve at 0.5h
# resolution under de_rating_by_auction_and_delivery_year.full_curves["T-4"]["2029-30"], from the
# same primary source: NESO Data Portal CKAN resource d94ff98d-39ba-40d6-9672-7433de0631ac (801
# records, sha256:1b786c11450c, sidecar assumptions/provenance/gb_v1_6/cm_derating.provenance.json;
# the 5h and 5.5h bins re-queried live on 2026-08-12). The duration-only key now carries that curve
# in full.
#
# NOTHING IS DERIVED, INTERPOLATED OR INVENTED HERE. Every bin written below is a published bin
# already present in this file. The 1h, 2h and 4h bins are unchanged to the digit. The published
# plateau bins 8.5h to 12h are written out individually at 0.9216 (rather than as the range key
# "8.5_to_12" the auction table uses) because both lookups parse keys as floats: a non-numeric key
# makes the WHOLE table read as malformed, and a malformed table prices the Capacity Market at
# GBP 0. That is a real trap, not a hypothetical one.
#
# WHY IT MATTERS. The production sizing search enumerates durations from 0.5h to 8h CONTINUOUSLY
# (optimisation/two_stage.py: COARSE_DURATION_HOURS = 0.5, 1, 1.5, 2, 3, 4, 6, 8;
# DURATION_BOUNDS_HOURS = (0.5, 8.0); NO_VIABLE_COVER_DURATION_HOURS = 0.5, 2, 8; and the adaptive
# refiner produces arbitrary durations in between). The lookup floors to the largest tabulated bin
# at or below the asset's duration. Against a 3-bin table that meant a 3h asset was priced at the
# 2h factor and an 8h asset at the 4h factor. Worse, a 0.5h asset fell BELOW the smallest bin,
# where the lookup returns the smallest bin's own factor: 0.1099 applied to a 0.5h unit whose
# published factor is 0.0557, i.e. nearly DOUBLE the de-rated capacity it is entitled to, and the
# warning text attached to that branch calls it "conservatively". That was the one branch on this
# key that moved a number in the flattering direction while announcing the opposite.
#
# DIRECTION OF EFFECT, per duration, on de-rated MW and therefore on CM revenue:
#     0.5h   0.1099 -> 0.0557   MINUS 49.3 pct   (WORSE; this is the branch that flattered)
#     1.0h   0.1099 -> 0.1099   unchanged
#     1.5h   0.1099 -> 0.1641   PLUS  49.3 pct   (BETTER)
#     2.0h   0.2198 -> 0.2198   unchanged
#     3.0h   0.2198 -> 0.3297   PLUS  50.0 pct   (BETTER)
#     4.0h   0.4396 -> 0.4396   unchanged
#     6.0h   0.4396 -> 0.6608   PLUS  50.3 pct   (BETTER)
#     8.0h   0.4396 -> 0.8777   PLUS  99.7 pct   (BETTER)
# The upward moves are the larger half and are stated first for that reason. They are not a
# re-estimate and they are not an optimisation: they replace a floor-to-a-lower-bin approximation
# with the auction's own published bin for that duration. The bias removed is a SELECTION bias as
# much as a pricing one, because the sizing objective optimises over duration: systematically
# under-rewarding every off-grid duration pushed the search away from long-duration candidates.
#
# NO PUBLISHED FIGURE MOVES TODAY. Every persisted run under runs/ prices CAPACITY_MARKET at 0.00,
# because all six live sites sit below the 1 MW connection-capacity threshold for prequalification
# (SI 2014/2043 reg 15) and the eligibility gate returns GBP 0 before any de-rating factor is read.
# The effect is on future sites at or above 1 MW, and on the sizing selection surface.
#
# WHAT THIS KEY STILL IS NOT. It remains a single auction x delivery-year slice (2029-30 T-4).
# de_rating_by_auction_and_delivery_year supersedes it for any new consumer and this release does
# not change that: the register's own note that a model MUST key on auction type as well as
# delivery year still stands as an open item, because the auction a site would bid into is not
# carried on SiteModel.
#
# ---------------------------------------------------------------------------------------------
# (2) penalties.cm_annual_cap_pct_of_revenue   VALUE UNCHANGED (100.0); source and notes CORRECTED
# ---------------------------------------------------------------------------------------------
# The 100 pct annual penalty cap is real and statutory (SI 2014/2043 reg 41(3A)(a)), so the VALUE
# does not move. What was wrong is the claim the release made ABOUT it. gb_v1_9's notes said "the
# annual cap means the worst-case annual outcome is losing the capacity payment plus paying an
# equal amount, not an unbounded loss". That is false as an UNCONDITIONAL statement. Under Sch 1
# para 6(2) and 6(2A) the annual cap applies only where a capacity provider penalty charge has
# been incurred in at least 48 relevant settlement periods AND those periods together comprise at
# least 8 relevant settlement periods in each of at least 6 months of the delivery year. Below
# that threshold the annual cap does not bind at all and only the 200 pct MONTHLY cap does, and
# 200 pct of the winter-weighted monthly capacity payments can exceed 100 pct of the annual
# payment. So 100 pct is a CONDITIONAL cap, not an unconditional worst case.
#
# DIRECTION OF EFFECT: the consumer (finance/cashflows.py, the CM penalty line at 1418-1454)
# scales this cap by the delivery shortfall and presents the result as the bounded worst case in
# the P90 series. Treating a conditional cap as unconditional UNDERSTATES the true unconditional
# bound, so the present treatment FLATTERS P90 and the DSCR. NO NUMBER MOVES IN THIS RELEASE:
# correcting the bound is a code change in a module this release does not own, so it is recorded
# here and on the key as an open item rather than applied by relabelling a statutory percentage.
#
# ---------------------------------------------------------------------------------------------
# (3) penalties.cm_penalty_rate_basis   VALUE EXTENDED, additive fields only
# ---------------------------------------------------------------------------------------------
# Gains annual_cap_is_conditional, annual_cap_condition, cap_that_applies_below_threshold and
# unconditional_annual_bound, so the conditionality travels with the regime record instead of
# living only in a review file (docs/reviews/2026-08-12-cm-penalty-statute-notes.txt). Every
# pre-existing field of this key is unchanged.
#
# NOTHING ELSE CHANGES. No key is added, no key is dropped, no status is promoted, no other value
# or source or note moves. Cutting this release changes what latest_version() resolves to, which
# is shared state for anything running against the newest release.
#
