      datasheet and warranty fade curve.
  ageing_exponents:
    value:
      calendar_time_exponent_p_nmc: 0.75
      calendar_time_exponent_p_lfp: 0.5
      cycle_throughput_exponent_q: 0.5
    unit: dimensionless exponents
    source: "docs/bess_degradation_requirements.md C-01/C-02/C-03 and its Constants table: p = 0.75 (NMC, Li(NiMnCo)O2 18650, 2014) Schmalstieg et al. 2014 via Reniers et al. 2018; p ~ 0.5 (LFP/graphite commercial cell, 2018) Naumann et al. 2018 (register marks this row as not re-fetched in-session); q = 0.5 (both NMC and LFP semi-empirical models, 2014-2020) Schmalstieg 2014 / Naumann 2020 via Reniers 2018."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      THE CALENDAR-VS-CYCLE SPLIT the degradation cost must respect (C-01): total fade is an
      ADDITIVE calendar term in t^p plus a cycle term in Ah^q, never one blended annual number.
      Both exponents are SUB-LINEAR, so a linear-in-time or linear-in-throughput fade model
      overstates early fade and understates late fade. Chemistry matters: pick p by chemistry, and
      note the LFP row is the weaker citation. These exponents describe FADE, not cost — the cost
      per MWh is battery_opex.degradation_marginal_cost_gbp_per_mwh and the depth dependence is
      cycle_depth_stress_coefficients.
  cycle_depth_stress_coefficients:
    value:
      k4: 0.000524
      k5: 2.03
      stress_function: "Phi(delta) = k4 * delta ** k5"
      marginal_form: "c_deg(delta) = R * k4 * k5 * delta ** (k5 - 1) / eta_dis, R in GBP/MWh of rated energy"
      alternative_k4_k5:
        k4: 0.00045
        k5: 1.3
      relative_marginal_cost_delta_0_8_vs_0_1: 8.55
    unit: dimensionless (k4, k5); GBP/MWh discharged for c_deg(delta)
    source: "docs/bess_degradation_requirements.md C-35 and its Constants table: k4, k5 = 5.24e-4, 2.03 for Li(NiMnCo)O2 18650 lab tests (2017-2018) — Xu, B., Oudalov, A., Ulbig, A., Andersson, G., Kirschen, D. 2017 (IEEE Trans. Smart Grid, arXiv:1709.05715) and Shi, Y., Xu, B., Tan, Y., Kirschen, D., Zhang, B. 2017 (arXiv:1709.05715v2); alternative planning-case-study pair 4.5e-4, 1.3 from Shi et al. 2017. The 8.55x ratio is derived in C-35 as (0.8/0.1)^1.03."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      THE DEPTH-AWARE MARGINAL WEAR COST (C-35), for the piecewise-linear objective term (C-16).
      Phi is convex at k5 = 2.03, so the marginal cost of the next MWh depends on how deep the
      current half-cycle already is: the marginal cost at delta = 0.8 is 8.55x that at delta = 0.1.
      A flat adder calibrated on one deep cycle per day therefore SUPPRESSES shallow, high-value
      frequency-response duty while UNDERCHARGING the deep tail. NMC parameterisation from lab
      cells; the register keeps the alternative (k4 4.5e-4, k5 1.3) rather than averaging. LFP
      coefficients exist separately (Naumann 2020 delta 4.0253, c 1.0923 via Butt & Verba 2026) and
      are NOT carried here because they parameterise a different functional form.
  degradation_cost_basis:
    value:
      formula: "c_deg = C_repl / (N_EFC_EOL * eta_dis)"
      c_repl_gbp_per_mwh_rated: 120000
      n_efc_to_eol: 6000
      eta_discharge: 0.94
      c_deg_gbp_per_mwh_discharged: 21.3
      calibrated_at_cycle_depth: 0.8
      published_c_repl_alternatives:
        xu_2017_usd_per_kwh: 300
        shi_2017_usd_per_kwh: 600
        uddin_2017_gbp_per_kwh: 500
        register_derived_energy_component_2025_gbp_per_kwh: 105
      published_efc_to_eol_ranges:
        lfp_to_80pct_soh_20_80_window: "3,500-5,000 EFC (Preger et al. 2020)"
        warranty_cycle_caps_2025: "10,000-12,000 cycles (DNV 2025)"
    unit: mixed (see keys); c_deg in GBP/MWh discharged
    source: "docs/bess_degradation_requirements.md C-34 (formula and worked GB example), C-37 (replacement-cost basis and its 6x published range: Xu et al. 2017 US$300,000/MWh; Shi et al. 2017 US$0.6/Wh; Uddin et al. 2017 £500/kWh via Butt & Verba 2026) and the Constants table rows 'Cost basis for the degradation term'. EFC ranges: Preger, Y. et al. 2020 (Sandia, 'Degradation of Commercial Lithium-Ion Cells as a Function of Chemistry and Cycling Conditions'); DNV, 'Financing the energy transition: building bankable battery projects'. Energy-capex comparator via docs/bess_constants_register.md (Modo 'Modelling Assumptions', July 2026 vintage)."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      THE AUDIT TRAIL for battery_opex.degradation_marginal_cost_gbp_per_mwh — kept as one entry so
      the flat number can never be quoted without its inputs. Two of the three inputs are
      worked-example choices, not published points: C_repl £120,000/MWh (nearest published GB
      comparator ~£105/kWh energy-capex component, 2025 real) and N_EFC,EOL 6,000 (published LFP
      EFC-to-80% at a 20-80% window is 3,500-5,000; warranty cycle caps are 10,000-12,000 on a
