      max_cycles_per_year_by_duration_h is itself an unsourced placeholder, so there is no warranty
      envelope in the library to derive it from. The published alternatives disagree (0.20-0.96
      Carmona, the more conservative usable window; 0.10-0.95 in D-169's illustration). WHAT WOULD
      SETTLE IT: the specific unit's OEM warranty operating envelope / BMS reserve, which C-29
      requires be implemented as hard dispatch constraints.
  soc_max_fraction:
    value: 0.95
    unit: fraction of rated energy capacity
    source: "docs/bess_degradation_requirements.md Constants table row 'SoC window, optimisation | 15-95 % | case-study assumption | 2017 | Xu et al. 2017' (arXiv:1709.05715). Alternative kept unaveraged: 0.96 (Carmona et al. 2024, arXiv:2409.03942 §3.1). See soc_min_fraction for the full basis."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      UPPER OPERATING SoC BOUND (D-169), paired with soc_min_fraction (80% usable window). Dwell at
      high SoC accelerates calendar fade (C-10), so the upper bound is a degradation lever as well
      as a warranty limit — it is NOT free headroom. Same caveat as soc_min_fraction: a published
      case-study assumption, not an OEM warranty term.
  warranty_cycle_cap_cycles_per_day:
    value:
      typical_low: 1.0
      typical_high: 2.0
      observed_range_low: 1.5
      observed_range_high: 4.0
      revenue_impact_pct_of_1_5_vs_4_per_day: {low: 10, high: 20}
      warranty_term_years_low: 15
      warranty_term_years_high: 25
      eol_soh_pct_warranty_current: 65
      eol_soh_pct_warranty_older: 70
      eol_soh_pct_academic_convention: 80
    unit: cycles/day; percent; years; percent SoH
    source: "docs/bess_degradation_requirements.md Constants table 'End of life, warranty and availability': warranty cycle cap typical 1-2 cycles/day (Lorscheid & Kairies 2025); observed field spread 1.5-4 cycles/day and a +/-10-20% revenue impact between 1.5-1.6/day and 4/day (Enspired via Energy-Storage.news 2025); warranty term 15-25 yr (Lorscheid & Kairies 2025; Huang 2026); EOL SoH 65% current / 60% in some contracts (Huang 2026), 70% older 15-20 yr terms (Lorscheid & Kairies 2025), 80% academic convention (Preger et al. 2020). Corroborated on term and cycles by DNV, 'Financing the energy transition: building bankable battery projects' (15-25 yr, 10,000-12,000 cycles)."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      THE PUBLISHED WARRANTY ENVELOPE, landed because max_cycles_per_year_by_duration_h carries no
      source at all and these are the market terms it should be reconciled against. Sanity check:
      365 cycles/yr at 2 h duration is 1.0 cycles/day (the conservative end of typical) and 548 at
      1 h is 1.5/day (the bottom of the observed range) — so the existing per-duration caps are
      inside, and at the tight end of, the published envelope. revenue_impact is carried as the
      published +/-10-20% RANGE, not a midpoint (the register's rule: nothing is averaged), and is
      directional only. EOL SoH is carried because
      the cycle cap is only meaningful against a stated end-of-life threshold, and warranty EOL
      (65-70%) is materially below the academic convention (80%) the cycle-life literature uses —
      mixing the two overstates life. NOT a substitute for the specific unit's warranty schedule.

