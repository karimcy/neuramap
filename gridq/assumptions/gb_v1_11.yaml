  fleet_availability_pct:
    value: 95.0
    unit: percent of hours available per year
    source: "Modo Energy, 'Model Calibration' (GB, January 2026 vintage), https://docs.modoenergy.com/pages/jan-2026/uk-europe/gb/model-calibration/ — the GB calibration decomposition attributes ~5% of the modelled-to-achieved revenue gap to AVAILABILITY (grid outages and maintenance), listed SEPARATELY from capacity degradation ~3% and imperfect foresight ~10%; calibrated to the Modo BESS Index (>190 sites, ~7 GW, 75th percentile of fleet revenues). Corroborated by Mongird, K. et al. 2020, PNNL, 'Grid Energy Storage Technology Cost and Performance Assessment' — 'Downtime assumption 5%', national-lab planning basis. Upper-bound comparators NOT used: ~98% state-of-the-art modern containers (Huang 2026; downtime 175 h/yr at 98%, 263 h/yr at 97%) and 98.7% MW-weighted / 99.3% for large projects (DNV-verified Fluence fleet, https://www.energy-storage.news/dnv-verifies-98-7-availability-of-fluences-global-battery-energy-storage-fleet/). Transcribed via docs/bess_constants_register.md and docs/bess_degradation_requirements.md."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      PUBLISHED FLEET AVAILABILITY, and it is DISTINCT FROM DEGRADATION (H-17). The two are separate
      lines in the same source decomposition — availability ~5%, capacity degradation ~3% — so
      applying degradation.annual_capacity_fade_pct and this factor together is NOT double-counting:
      fade shrinks the MWh the asset can deliver, availability removes the HOURS in which it can
      deliver anything. 95.0 is the CONSERVATIVE end of the published range and is chosen because
      the register's caveat on the 98.7% vendor figure is explicit: strong selection bias,
      single-vendor, utility-scale, MW-weighted, 'do not use as the availability input for a BTM
      asset'. A behind-the-meter asset additionally loses hours to causes absent from every fleet
      figure — host planned shutdown, comms link, aggregator platform — which push the true number
      DOWN, not up. WHAT THIS IS NOT: it is an annual scalar on energy and payment volumes, and it
      MUST NOT be used for the frequency-response availability factor F (see
      ancillary_services.availability_factor_f_threshold_pct), where 1.8 seconds of unavailability
      zeroes a whole settlement period and the block factor takes the minimum — an annual scalar is
      invalid there. It is also NOT the site-specific firm-commitment factor
      (expected_availability_pct, which stays an empty home per D30). H-17 requires availability be
      decomposed into planned maintenance, augmentation-outage and forced-outage components with
      their TIMING; a single scalar cannot represent an outage falling on a Capacity Market
      Satisfactory Performance Day, which risks termination rather than lost hours. WHAT WOULD
      SETTLE IT: an operational availability record for comparable BTM C&I assets, or the O&M
      contract's guaranteed availability with its measurement basis.

penalties:
  cm_penalty_rate_fraction_of_clearing:
    value: 0.0416667
    unit: fraction of clearing price per MWh undelivered
    source: "The Electricity Capacity Regulations 2014 (SI 2014/2043), Schedule 1 paragraph 5(3) (current amended text, read directly from the legislation.gov.uk revised version on 2026-08-12, amendments applied through 23 July 2025): 'PRN is to be calculated in accordance with the formula — PRN = PEzx x (1/24)', with PEzx 'the price in pounds per MW determined for COzx in accordance with paragraph 3(4) to (5)' (para 5(4), F18/F19 text). 1/24 = 0.0416667. https://www.legislation.gov.uk/uksi/2014/2043/schedule/1 (formula verified from the PDF rendering, https://www.legislation.gov.uk/uksi/2014/2043/schedule/1/data.pdf, because the HTML shows it as an image). Pending amendment check: SI 2026/850 (The Electricity Capacity (Amendment and Transitional Provision) Regulations 2026) amends regulations 2, 16, 21, 32, 34, 43, 51-53, 59, 60 and inserts 59A — it does NOT touch Schedule 1 paragraph 5, so the formula stands."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      CORRECTED in gb_v1_8 from the research-grade placeholder 0.25 (which encoded PE/4). THE
      STATUTE IS UNAMBIGUOUS AND WAS READ DIRECTLY — PRN = PEzx x (1/24) — which is why the
      correction is made rather than only flagged (the D45 brief licenses correcting where the
      primary legislation is explicit). DIRECTION, STATED PLAINLY: THIS CHANGE FLATTERS every quote
      carrying contracted CM revenue — it reduces the bounded worst-case penalty exposure line
      (finance W8) by ~6x. It is disclosed here, in the release header, and in
      docs/derived_assumptions_log.md precisely because a flattering correction deserves more
      scrutiny, not less. Now CONSISTENT with cm_penalty_rate_basis (implied_fraction 0.0416667),
      resolving the internal contradiction gb_v1_7 carried deliberately. Worked scale: at the
      2029-30 T-4 price of GBP 27,100/MW/yr, PR = GBP 1,129/MWh of shortfall; a 1 MW shortfall for
      one settlement period costs ~GBP 565. The caps (200% monthly / 100% annual) bound the
      worst case and are unchanged. Base-rate context: zero System Stress Events declared since the
      CM began.
  cm_monthly_cap_pct_of_revenue:
    value: 200.0
    unit: pct of monthly capacity revenue
    source: "Regulation 41(3A) of SI 2014/2043 (via cm_penalty_rate_basis) and NESO Capacity Market Auction Static Data (Monthly Penalty Cap 200% for every auction from 2016-17 TR to 2029-30 T-4), https://www.neso.energy/data-portal/capacity-market-register/capacity_market_auction_static_data. Originally landed from perimeter research (docs/reviews/2026-07-01-deep-review.md); corroborated by the primary sources in gb_v1_7 (cm_penalty_rate_basis) and the status promoted accordingly in gb_v1_8."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: Monthly penalty cap. VALUE UNCHANGED; status placeholder -> needs_review in gb_v1_8 because the value is corroborated by primary legislation and the NESO static data for every auction to date (see cm_penalty_rate_basis). Not confirmed — human confirmation against the agreement's own terms still required.
  cm_annual_cap_pct_of_revenue:
    value: 100.0
    unit: pct of annual capacity revenue
    source: "Regulation 41(3A)(a) of SI 2014/2043 (The Electricity Capacity Regulations 2014): 'The percentages to be included in the capacity market register under regulation 31(2)(f) are (a) for the annual penalty cap, 100%'. CONDITIONALITY, Schedule 1 paragraphs 6(2) and 6(2A) (substituted 14.7.2016 by SI 2016/742): the annual cap enters the settlement calculation ONLY where a capacity provider penalty charge has been incurred in respect of the CMU in at least 48 relevant settlement periods AND those periods together comprise at least 8 relevant settlement periods in each of at least 6 months in the delivery year; below that threshold only the 200% MONTHLY cap of paragraph 6(4) applies. https://www.legislation.gov.uk/uksi/2014/2043/schedule/1. Corroborated for value by NESO Capacity Market Auction Static Data (Annual Penalty Cap 100% for every auction from 2016-17 TR to 2029-30 T-4), https://www.neso.energy/data-portal/capacity-market-register/capacity_market_auction_static_data. Statutory text read directly and recorded in docs/reviews/2026-08-12-cm-penalty-statute-notes.txt."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-16
    notes: >-
      Annual penalty cap, consumed by finance (W8) as the bounded worst-case P90 penalty line on
      contracted CM revenue. VALUE UNCHANGED at 100.0 and status unchanged; what gb_v1_10 corrects
      is the CLAIM this key previously made about itself. gb_v1_9 read "the annual cap means the
      worst-case annual outcome is losing the capacity payment plus paying an equal amount, not an
      unbounded loss". THAT IS FALSE AS AN UNCONDITIONAL STATEMENT and the sentence is withdrawn.
      The 100 pct annual cap is CONDITIONAL: under Sch 1 para 6(2)/(2A) it binds only once penalty
      charges have been incurred in at least 48 relevant settlement periods comprising at least 8
      in each of at least 6 months of the delivery year. Below that threshold the binding limit is
      the 200 pct MONTHLY cap, applied month by month, and 200 pct of the winter-weighted monthly
      capacity payments can exceed 100 pct of the annual capacity payment. So this value is NOT a
      bound that always holds, and a worst case built on it alone is not a worst case.
      DIRECTION OF EFFECT: treating a conditional cap as unconditional UNDERSTATES the exposure,
      so the present consumer treatment FLATTERS P90 and the DSCR. NOT YET FIXED IN CODE: the
      consumer is the CM penalty line in src/gridq/finance/cashflows.py (roughly 1418-1454), which
      reads this percentage, scales it by the delivery shortfall and labels the result the bounded
      worst case. Correcting it needs the monthly-cap limb and the para 6(2A) trigger, which is a
      finance-module change, not an assumption edit; relabelling a statutory percentage to fake
      the bound would be worse than leaving it declared. See cm_penalty_rate_basis for the fields
      a corrected consumer should read. CONTEXT: zero System Stress Events have ever been declared,
      so the realistic expected penalty is near zero and the 48-period/6-month trigger has never
      been capable of being met; the exposure that matters is Satisfactory Performance Day and
      Extended Performance Test failure leading to termination, which is a different instrument.
  cm_penalty_rate_basis:
    value:
      penalty_rate_formula: "PR = PE / 24, i.e. the CPI-indexed clearing price in GBP/MW/year divided by 24, expressed in GBP/MWh of shortfall"
      implied_fraction_of_clearing_per_mwh: 0.0416667
      monthly_cap_pct_of_monthly_capacity_payment: 200
      annual_cap_pct_of_annual_capacity_payments: 100
      annual_cap_is_conditional: true
      annual_cap_condition: "SI 2014/2043 Sch 1 para 6(2)/(2A): the 100 pct annual cap enters the settlement calculation ONLY where a capacity provider penalty charge has been incurred in respect of the CMU in at least 48 relevant settlement periods AND those periods together comprise at least 8 relevant settlement periods in each of at least 6 months in the delivery year"
      cap_that_applies_below_threshold: "the 200 pct MONTHLY cap of Sch 1 para 6(4) alone, applied month by month (MPC_ij = RMCP_ij + sum of ASPPA', with RMCP_ij = ACP_ix x WF_mx x F_i)"
      unconditional_annual_bound: "NOT 100 pct. With the para 6(2A) trigger unmet the annual total is bounded only by the sum of the monthly caps, i.e. up to 200 pct of the winter-weighted monthly capacity payments for the months in which penalties are incurred, which can exceed 100 pct of the annual capacity payment. A model that presents 100 pct as the unconditional worst case UNDERSTATES the exposure and therefore flatters P90 and DSCR"
      cap_percentages_are_register_values: "reg 31(2)(f) puts both percentages on the capacity market register as at the date of issue of the capacity agreement; reg 41(3A) fixes them at 100 pct annual and 200 pct monthly. An actual agreement's own register entry governs and must be read per CMU"
      worked_example_2029_30_t4: "at PE = GBP27,100/MW/yr, PR = GBP1,129/MWh; a 1 MW shortfall for one 0.5 h settlement period costs about GBP565"
      stress_events_declared_to_date: 0
      capacity_market_notices_since_2019: 13
      cmn_trigger: "Anticipated System Margin for a Settlement Period below 500 MW, at least 4 hours after the expiry of the current Settlement Period"
      stress_event_definition: "a Settlement Period in which a System Operator Instigated Demand Control Event occurs lasting at least 15 continuous minutes"
    unit: GBP/MWh; percent; count
    source: "The Electricity Capacity Regulations 2014 (SI 2014/2043), Schedule 1 paragraphs 5(3) and 6(4) and regulation 41(3A), https://www.legislation.gov.uk/uksi/2014/2043; NESO, Capacity Market Auction Static Data (Annual Penalty Cap 100%, Monthly Penalty Cap 200% for every auction from 2016-17 TR to 2029-30 T-4), https://www.neso.energy/data-portal/capacity-market-register/capacity_market_auction_static_data; DESNZ/NESO, Capacity Market Rules consolidation 24 July 2026, Rules 8.4.1, 8.4.6(a)(ii), 8.4.7(b), 8.5.1(a); DESNZ, 'Capacity Market Ten-Year Review', December 2024, pp.13-14 and Figure 1, https://assets.publishing.service.gov.uk/media/675fee720fb02bbe4853ef3f/capacity-market-10-year-review.pdf. Transcribed via docs/bess_constants_register.md."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      THE SOURCED CM PENALTY REGIME. In gb_v1_7 this entry CONTRADICTED
      cm_penalty_rate_fraction_of_clearing (0.25, apparently PE/4); in gb_v1_8 that contradiction
      is RESOLVED — the rate key now carries the statutory 0.0416667 (PE/24), read directly from
      the current amended text of Sch 1 para 5(3) on 2026-08-12, and the pending SI 2026/850
      amendments were checked and do not touch Sch 1 para 5. The correction FLATTERS quotes and is
      disclosed as such on the rate key. The two CAPS (200% monthly, 100% annual) are confirmed by
      primary legislation and the NESO static data for every auction to date; their statuses were
      promoted to needs_review in gb_v1_8, values unchanged. CONTEXT FOR THE PROBABILITY: zero
      System Stress Events have ever been declared since the Capacity Market began, and only 13
      Capacity Market Notices since 2019, so the base-case expected non-delivery penalty is near
      zero — the real CM risk sits on Satisfactory Performance Day / Extended Performance Test
      failure and termination, which is categorically different from losing hours of revenue and
      cannot be modelled as an availability haircut.
      EXTENDED IN gb_v1_10, additive fields only, no existing field touched:
      annual_cap_is_conditional, annual_cap_condition, cap_that_applies_below_threshold,
      unconditional_annual_bound and cap_percentages_are_register_values. They record that the
      100 pct ANNUAL cap is NOT an unconditional bound, because Sch 1 para 6(2)/(2A) gates it on
      penalties incurred in at least 48 relevant settlement periods comprising at least 8 in each
      of at least 6 months of the delivery year; below that trigger only the 200 pct monthly cap
      applies and the annual total can exceed 100 pct of the annual capacity payment. A consumer
      that presents 100 pct as the worst case understates the exposure and so FLATTERS P90 and
      DSCR. The consumer is not yet corrected; the open item is recorded on
      cm_annual_cap_pct_of_revenue with the file and line range.

