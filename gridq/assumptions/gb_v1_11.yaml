    notes: >-
      Target equity return the price recommendation must hit. The plan cites a 12–13% band today
      (13%+ for an unproven class, trending to ~11% as the asset class matures); 12.0 is the LOW end,
      chosen conservatively (a higher hurdle is harder to clear). Promoted placeholder->needs_review on
      this in-repo citation. This is a target hurdle, NOT Sim's confirmed portfolio cost of capital —
      confirm with the Finance lane (Sim) per docs/assumptions_to_source.md.
  debt_gearing_pct:
    value: 50.0
    unit: percent
    source: "SOURCED IN gb_v1_11 (2026-08-17), replacing the 60.0 placeholder ('illustrative project-finance gearing', goal workstream 2026-07-02, no citable source). CEPA for DESNZ, 'Hurdle rate estimates for electricity sector technologies', 2025, section 4.4.5 - 50 pct notional gearing is the common assumption across all 30 technologies, with sensitivities at 0, 25 and 75 pct, and CEPA states it is within +/-10 pct of the median reported gearing for a wide range of technologies in its investor survey. https://assets.publishing.service.gov.uk/media/68cd1d818c44a661b4995d9f/cepa-desnz-hurdle-rates-electricity.pdf. Already carried in docs/bess_constants_register.md, together with the same source's lithium-BESS hurdle rate (8.9 pct pre-tax real CPI mid, quoted AT 50 pct gearing, so 50 is the gearing that hurdle rate is internally consistent with) and Ofgem's LDES Window 1 cap-and-floor notional gearing of 37.5 pct, which is lower still. The 60 pct it replaces sat ABOVE the GB published notional and below the US 'contracted' convention (60-65 pct, a commercial blog). Fetched/derived 2026-08-17."
    status: needs_review
    owner_or_reviewer: Olly (confirm with Sim - portfolio finance)
    confidence: low
    last_reviewed: 2026-08-17
    notes: >-
      Share of capex funded by debt. Present so DebtTerms can assemble in real mode and the
      P90-DSCR covenant gate is exercisable end-to-end (previously the gate could never fire
      without injected debt terms - vacuous logic).
      DIRECTION OF EFFECT: DOWN on debt quantum, from 60 pct to 50 pct of capex. On a levered run
      that means less debt, less interest, a smaller balance to service and therefore a HIGHER DSCR,
      while equity carries more of the asset. NO PRICED FIGURE MOVES ON ANY CAMPAIGN SITE TODAY,
      because those sites underwrite UNLEVERED.
      WHY UNLEVERED, AND THIS SETTLES THE QUESTION RATHER THAN LEAVING IT OPEN: non-recourse project
      finance is not available at this ticket size. Every observed GB BESS financing in the register
      is orders of magnitude larger than these assets - the SMALLEST is a c.£42.7m facility, against
      batteries costing £17,500 to £525,000 at the corrected capex - CEPA received NO investor survey
      responses at all for the return on debt on lithium BESS, and observed merchant tenors are 1-3
      years against a 10-year-plus asset life. Sub-MW commercial BTM assets are funded from balance
      sheet, equity, asset finance or lease, or a third-party-ownership shared-savings structure. A
      DSCR on a £50,000 asset is not a meaningful test. CLAUDE.md section 2 already prescribes the
      response: underwrite unlevered with the band adjusted.
      SO THIS CHANGE IS FOR CORRECTNESS, NOT TO ENABLE A DSCR OR TO MOVE A RETURN. It replaces an
      unsourced figure with the GB published notional and leaves the verdicts where they are.
      THE 'NO PRICED FIGURE MOVES' CLAIM IS MEASURED, NOT ASSERTED (2026-08-17): all nine records in
      examples/real/sites/ carry counterparty.credit_status = 'unknown', and
      finance.credit.build_debt_terms_from_credit returns (None, None) for 'unknown' and
      'not_assessed' - it never defaults to a band - so NO DebtTerms assembles on any campaign site
      and this key is not read on any of their runs. The key IS reachable: on an assessed
      counterparty the same function returns DebtTerms(gearing_pct=50.0, ...), so the value flows the
      moment a credit assessment exists.
      CONFIRMATION ASK (unchanged, and now sharper): Sim to confirm the actual funding route for
      sub-MW BTM assets. If it is asset finance or a lease rather than project debt, this key is the
      wrong instrument for it and the finance model needs a lease treatment, not a gearing
      percentage. No published GB source for sub-MW BESS lease or asset-finance rates was found
      (searches recorded in docs/bess_constants_register.md).
  credit_rate_tenor_policy:
    value:
      strong: {rate_pct: 6.0, tenor_years: 12}
      adequate: {rate_pct: 7.5, tenor_years: 10}
      weak: {rate_pct: 9.5, tenor_years: 7}
    unit: "{credit_band: {rate_pct: percent, tenor_years: years}}"
    source: "PLACEHOLDER — illustrative credit policy carried from gb_v0_1 (Sim to set real bands); folded into this release per decision D19 (gb_v1_0 was built from the committed gb_v0_1 and missed the D18 addition)."
    status: placeholder
    owner_or_reviewer: Sim (portfolio finance / credit policy)
    confidence: low
    last_reviewed: 2026-07-02
    notes: >-
      Deterministic credit-band -> (rate, tenor) mapping (M9 v1 deliverable, finance/credit.py).
      Keys are CreditStatus values; only strong/adequate/weak are mappable. unknown/not_assessed
      are deliberately absent -> unavailable, never invented. Worse band -> higher rate / shorter
      tenor (monotonicity enforced in code). Values unchanged from gb_v0_1; still placeholder
      credit policy until Sim confirms. Bump the library version when confirmed.
  cpi_pct_per_year:
    value: 2.0
    unit: percent per year
    source: "OBR, 'Economic and fiscal outlook — March 2026', https://obr.uk/efo/economic-and-fiscal-outlook-march-2026/ (PDF: https://assets.publishing.service.gov.uk/media/69a6d7b62e1f4fbda4252208/economic-and-fiscal-outlook-march-2026-web-accessible.pdf) — CPI inflation falls from 3.4% (2025) to 2.3% (2026) and 2.0% FROM 2027 ONWARDS, reaching the 2% target in late 2026 and staying around it to the end of the forecast (2030-31). Long-run corroboration: OBR long-term determinants (March 2024) via CEPA for DESNZ, 'Hurdle rate estimates for electricity sector technologies', 2025, Table 4.9 — CPI 1.95% 15-year average FY24/25-FY38/39, https://assets.publishing.service.gov.uk/media/68cd1d818c44a661b4995d9f/cepa-desnz-hurdle-rates-electricity.pdf; regulatory precedent: Ofgem, 'Decision - Financial Framework: LDES Window 1 Cap and Floor regime', September 2025 — deflates the cost of capital at the Bank of England 2% CPI target, https://www.ofgem.gov.uk/sites/default/files/2025-09/LDES%20Window%201%20Financial%20Framework%20Decision.pdf. Fetched 2026-08-12."
    status: needs_review
    owner_or_reviewer: Oli (confirm with Sim — portfolio finance)
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      CLOSED FROM NULL in gb_v1_8 (D45: an escalation rate read as null silently runs nominal
      revenue against real opex, drifting ~2%/yr compounding — a ~35% terminal-year margin error
      over 15 years). The three decisions the gb_v1_7 empty home named are answered here and remain
      Sim's to confirm: (1) INDEX = CPI (the OBR forecast basis; the RO buy-out moved to CPI
      indexation on 1 April 2026 and T-4 CM agreements are CPI-indexed — CPIH remains the Ofgem
      LDES basis and is NOT interchangeable, flag if a CPIH-linked line appears); (2) RATE = 2.0
      flat, the OBR March-2026 EFO settled rate from 2027 and the BoE target — near-year path if
      wired per-year: 2026 2.3, 2027+ 2.0 (using 2.0 flat UNDERSTATES 2026 escalation by 0.3pp,
      immaterial over a 15-year horizon and conservative on indexed revenue); (3) LINES INDEXED
      (H-15) = opex (battery_opex.annual_fixed_opex), business_rates, insurance, metering_idno,
      dno_costs, land rent if ever separated, and CPI-linked CONTRACTED revenue (T-4 CM clearing
      prices from their stated base winter; RO buy-out) — deflate consistently with the
      discount-rate basis (a nominal hurdle discounts nominal cashflows; never mix). DIRECTION,
      PER LINE, effective when the escalation machinery is wired (no src consumer read this key at
      cut time): escalating costs makes every site look WORSE; indexing T-4 CM revenue makes CM
      sites look BETTER; net effect is site-dependent and must never be netted silently. Note the
      requested path `macro.cpi_pct_per_year` is not expressible: `macro` is not a section in
      src/gridq/assumptions/models.py, and adding one is a schema change.

