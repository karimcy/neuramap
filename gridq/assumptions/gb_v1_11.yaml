metering_idno:
  annual_gbp_per_site:
    value: 0
    unit: GBP/site/yr
    source: "SOURCED IN gb_v1_11 (2026-08-17), replacing 'No citable source identified' (W4-3 review 2026-06-24, carried from gb_v0_1). TWO LIMBS, and the second decides the value. (1) MAGNITUDE: LASER Energy - the public-sector energy buying framework operated by Commercial Services Kent Ltd, wholly owned by Kent County Council - 'Market-wide Half Hourly Settlement' guidance page, last updated 29/08/2025, https://www.laserenergy.org.uk/market-wide-half-hourly-settlement/, states of the metering and data costs of EXISTING half-hourly metered supplies: 'which are ~£400 per meter per annum in aggregate'. RE-VERIFIED BY DIRECT FETCH 2026-08-17 (Olly), independently of the research pass: the quoted sentence is present, as is 'The current terms Meter Operator (MOP...) and Data Collector (DC...) will cease to exist.' That is ONE THIRD of the £1,200 this key carried, and it is the best-authority figure found (a buying organisation publishing the aggregate MOP + DC + DA cost it sees across a large aggregated portfolio). (2) INCIDENCE: the cost is the HOST SITE's and is not battery-INCREMENTAL. The two streams in these sites' priced floor - DUOS_RED_BAND_AVOIDANCE and tariff/ToU arbitrage - are realised entirely through the host's EXISTING half-hourly boundary meter; a no-export behind-the-meter battery re-shapes that MPAN's import and adds no boundary Metering System. Elexon P375 exists precisely because settling an asset BEHIND the boundary point otherwise cannot happen (Ofgem, 'BSC P375: Settlement of Secondary BM Units using metering behind the site Boundary Point', decision 24 February 2021, already carried in docs/bess_constants_register.md), and P375 asset metering is triggered by BM / VLP participation, which is NOT on the priced-floor basis; Elexon's own framing is that 'the P375 solution requires the Boundary Point meter to be submitting Half Hourly data into Settlements', i.e. the boundary meter is a PRECONDITION rather than something the battery adds. The UK government's own storage cost taxonomy places metering inside CAPEX and carries no annual metering line at all: DESNZ, 'Energy Innovation Needs Assessment: Energy Storage' (RAF134/2223), June 2025, p.31 - 'Grid integration, including costs associated with connecting the ESS to the grid, including transformer cost, metering, and isolation breakers' - https://assets.publishing.service.gov.uk/media/69449d0c9273c48f554cf642/einas-2025-energy-storage.pdf. NOTE THE KEY NAME IS NOW STALE TWICE OVER: MOP/DC/DA are being replaced under MHHS by Metering Service and Data Service roles (Ofgem, 'Market-wide Half-Hourly Settlement: Final Impact Assessment', 20 April 2021, para 3.35), and 'IDNO' is a different category again - an Independent DNO charge arises only where the site sits inside an independently-owned embedded distribution network, which none of the campaign sites is recorded as doing. Renaming the key is a schema change and is not done here. Fetched 2026-08-17."
    status: needs_review
    owner_or_reviewer: Olly (confirm against the site's MOP contract)
    confidence: low
    last_reviewed: 2026-08-17
    notes: >-
      DIRECTION OF EFFECT: DOWN, MINUS £1,200/site/yr at EVERY battery size, so it makes every site
      look BETTER. It is size-invariant because finance.cashflows.build_cost_lines charges this line
      with no power_mw multiplier: a 2 kW battery and a 750 kW battery paid the same £1,200. That was
      24.2 pct of the whole 100 kW fixed stack and 36.8 pct of a 25 kW battery's. BECAUSE IT
      FLATTERS, IT IS LANDED IN THE SAME RELEASE AS THE +40 pct CAPEX CORRECTION, which more than
      cancels it above about 84 kW at 2 h (release header, item 3).
      THE VALUE IS ZERO AS AN INCREMENTAL COST, NOT AS AN ABSENT INPUT. This is a declared, reasoned
      zero on a cost line, which is a value; it is not the D45 failure mode of an empty field read
      as zero on a REVENUE line. The honest reading for the no-export floor basis is that the
      battery causes no new metering contract.
      THE CONSERVATIVE ALTERNATIVE IS £400/site/yr, and it is the sourced number to use if the
      model's convention is to book the host's whole metering cost against the project (LASER
      Energy, above). Choosing between them is a convention question, not an evidence question, and
      the difference is £400/yr at every size. A THIRD figure applies only if BM/VLP is ever enabled:
      P375 asset metering plus the £5,000 + VAT VLP Agreement already in the register - off the
      priced-floor basis, so out of scope here.
      CONFIRMATION ASK: confirm from the site's supply and MOP arrangements that installing a
      no-export BTM battery requires NO new MPAN, no new Metering System and no change to the MOP /
      Data Service contract. If it does, the incremental cost is the delta on that contract, and if
      the convention changes to booking the host's metering cost against the project, use £400.

dno_costs:
  annual_gbp_per_site:
    value: 0
    unit: GBP/site/yr
    source: "REFUTED AND SET TO ZERO IN gb_v1_11 (2026-08-17). The £1,500/yr this key carried was recorded as 'No citable source identified' (W4-3 review 2026-06-24) and is CONTRADICTED by the operative text of two DNO charging statements. PRIMARY: National Grid Electricity Distribution (South West) plc, 'Statement of Methodology and Charges for Connection to National Grid Electricity Distribution (South West) plc's Electricity Distribution System', June 2026, https://connections.nationalgrid.co.uk/downloads/229320/south-west-june-26-statement-of-methodology-and-charges.pdf (fetched and text-extracted 2026-08-17). Clause 6.4: 'The cost of future operations, repairs and maintenance of the connection assets and our Distribution System is normally recovered through the on-going charges for use of system you pay as part of your quarterly or monthly electricity supply bill.' Clause 5.12, on anything above the Minimum Scheme: the costs of future operation and maintenance 'would normally be levied as a one-off charge representing the net present value of the future operation and maintenance costs and calculated as a percentage (specified in Section [6]) of the additional capital cost of the Scheme'. Clause 6.5 states the same capitalisation in the other direction. The document's own worked examples add the O&M percentage ONCE to the Connection Charge ('Operations & maintenance @ 20 pct of £12,300 = £2,460'), never annually. CORROBORATION: Northern Powergrid (Northeast) plc, Connection Charging Methodology Statement, February 2024, https://www.northernpowergrid.com/sites/default/files/assets/Northern%20Powergrid%20(Northeast)%20Connection%20Charging%20Methodology%20Statement%20February%202024.pdf - lists 'Operations, repairs and maintenance' as Non-Contestable Work the DNO itself performs, assigns scheme-specific ongoing costs such as communications to 'We fund' across all three flexible-connection types, and levies recurring O&M charges only for Speculative Developments (para 5.49), a housing-development category rather than a battery at an existing commercial site. SO THERE ARE EXACTLY THREE WAYS A DNO TAKES MONEY FROM A BTM SITE AND NONE IS AN ANNUAL PER-SITE OPERATING CHARGE: Use of System (DUoS unit, capacity, fixed and reactive charges), which this library ALREADY PRICES SEPARATELY in the duos section, so this key was either double-counting it or annualising a one-off; the one-off Assessment and Design charge, now carried as battery_capex.dno_assessment_and_design_one_off_gbp_per_site = £1,557 for the >50 kVA LV generation category these sites fall in; and capitalised above-Minimum-Scheme O&M, a one-off NPV percentage of the additional capital cost. Fetched 2026-08-17."
    status: needs_review
    owner_or_reviewer: Olly (confirm against the site's connection offer)
    confidence: low
    last_reviewed: 2026-08-17
    notes: >-
      DIRECTION OF EFFECT: DOWN, MINUS £1,500/site/yr at EVERY battery size, so it makes every site
      look BETTER. Size-invariant for the same reason as metering_idno: build_cost_lines charges it
      with no power_mw multiplier. Together those two deletions remove £2,700/yr - 54.5 pct of the
      100 kW fixed stack, 82.8 pct of a 25 kW battery's - and FOUR of the SEVEN sites that produced a
      priced floor at all had a net annual floor SMALLER than £2,700 (£1,463, £708, £340 and £0), so for those sites this is the difference between
      a structurally impossible project and one whose viability is decided by its revenue and its
      capex. BECAUSE IT FLATTERS, IT IS LANDED WITH THE +40 pct CAPEX CORRECTION IN THE SAME
      RELEASE.
      ZERO HERE IS A DECLARED STRUCTURAL ZERO, NOT AN EMPTY FIELD: the recurring charge does not
      exist, on the primary text above. The money that does exist moved to where it belongs -
      £1,557 one-off in battery_capex (REFERENCE ONLY, not yet consumed, which UNDERSTATES capex and
      is filed as an open item), and DUoS in the duos section where it was already priced.
      ONE REAL RECURRING DNO COST MUST NOT BE LOST WITH THIS LINE. If the battery raises the site's
      agreed capacity (MIC/MEC), the DUoS CAPACITY charge rises - genuinely recurring, genuinely
      caused by the battery, and it belongs inside the DUoS lines rather than in a flat per-site
      line. The register records 2025/26 DUoS capacity charges up 108 pct on average and up to
      246 pct in Northern Powergrid Northeast while standing charges fell 72 pct, so the magnitude
      is not trivial. A no-export battery sized inside existing headroom should need no MIC uplift;
      one that does incurs a real cost this key no longer hides.
      CONFIRMATION ASK: the DNO connection offer for the site, which states the one-off A&D charge,
      any capitalised O&M percentage, and whether the connection requires an MIC/MEC increase.

