# GridQ assumption library — GB, v1.1  (release: gb_v1_1)
#
# W8 release (2026-07-02), built from FROZEN gb_v1_0 (never an in-place edit):
#   (a) financing.credit_rate_tenor_policy folded in from the gb_v0_1 line — the two release
#       lines had diverged (D19/D18 coordination debt); quotes pinned to the v1 line can now
#       resolve the M9 credit mapping.
#   (b) The D30 growth sections populated as labelled placeholders:
#       - availability: empty-value homes (a price is asserted only from an awarded tender);
#       - penalties: CM non-delivery rate + caps as RESEARCH-GRADE placeholders whose `source`
#         names the unverified review record — confirm against the Capacity Market Rules;
#       - tnuos: the un-firmable demand residual home (site-banded; never estimated).
# NOTHING here is `confirmed`. Do NOT present any quote built on this release as bankable.
# Loaded via gridq.assumptions.load_assumptions("gb_v1_1").

metadata:
  market: GB
  version: gb_v1_1
  released: 2026-07-02
  currency: GBP
  notes: 'GB assumptions v1.1 (W8, 2026-07-02): gb_v1_0 + (a) financing.credit_rate_tenor_policy folded
    from the gb_v0_1 line (closing the D19/D18 coordination debt — the two release lines no longer diverge);
    (b) the D30 optional sections (availability, penalties, tnuos) populated as fully-labelled PLACEHOLDERS
    — the penalty caps are research-grade with the review record named as the source and must be confirmed
    against the CM Rules; nothing is confirmed and no quote on this release is bankable. gb_v1_0 and
    gb_v0_1 stay FROZEN.'
