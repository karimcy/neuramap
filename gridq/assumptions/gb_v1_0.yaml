# GridQ assumption library — GB, v1.0  (release: gb_v1_0)
#
# PROVENANCE PASS over gb_v0_1 (W4-3, 2026-06-24). Each value is either:
#   (a) backed by a citable source, named inline in `source` so any output/frontend can
#       show exactly where a number came from; or
#   (b) an honest, UNCONFIRMED placeholder/needs_review carried forward unchanged from
#       gb_v0_1 because no citable source exists yet.
# NOTHING here is `confirmed`. Do NOT present any quote built on this release as bankable.
# No number was invented or guessed: where the source documents establish a requirement but
# state no figure, the value stays a labelled placeholder (see round_trip_efficiency).
# The gaps — ranked by impact, each with the public source to consult — are tracked in
# docs/assumptions_to_source.md. gb_v0_1 stays FROZEN for provenance; this is a new file,
# never an in-place edit (see docs/assumption_library.md). Loaded via
# gridq.assumptions.load_assumptions("gb_v1_0").

