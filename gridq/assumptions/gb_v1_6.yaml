# GridQ assumption library — GB, v1.6  (release: gb_v1_6)
#
# FETCHER-BACKED over gb_v1_5 (Revenue-Data Drive slice 4, 2026-07-20): four revenue leaves are
# re-sourced from LIVE perimeter fetches — every changed number is transcribed from a fetched
# public source, hashed and pinned to a committed provenance sidecar (assumptions/provenance/
# gb_v1_6/), never invented. The fetchers (gridq.dev.fetch_neso_ckan, gridq.dev.fetch_piclo) are
# OFF the pricing path; this file is a hand transcription of what they returned. Changes:
#   - capacity_market.clearing_price_gbp_per_kw_yr        30.0  -> 27.1     (NESO CM clearing, latest T-4)
#   - capacity_market.de_rating_factor_by_duration_h      {..} -> {1:0.1099,2:0.2198,4:0.4396}
#                                                                (NESO CM de-rating, latest T-4; primary source)
#   - ancillary_services.dc_dm_dr_value_gbp_per_mw_yr     0    -> 28296.9  (NESO EAC DC/DM/DR mean x 8760; GATED)
#   - local_flex_piclo.utilisation_price_gbp_per_mwh      150.0 -> 135.67  (Piclo Competitions median)
#   - wholesale_p415.gated_upside_value_gbp_per_mw_yr     0    -> 0        (STAYS 0; source/notes rewritten only)
#   - balancing_mechanism.gated_upside_value_gbp_per_mw_yr 0   -> 0        (STAYS 0; note-only)
# Every OTHER gb_v1_5 value (incl. local_flex_piclo.aggregator_cut_pct and the whole capex/opex/
# finance/haircut/DUoS stack) is carried forward UNCHANGED. The CM stream stays CONDITIONAL and
# DC/DM/DR + wholesale + BM stay GATED upside — none can EVER be FIRM, whatever the fetched £; the
# ancillary value being nonzero is indicative/gated only. NOTHING here is `confirmed` (0 confirmed
# repo-wide, by design) — no quote on this release may present as bankable, and the app stays
# pinned to gb_v1_4 (this release is invisible to the golden). gb_v0_1..gb_v1_5 stay FROZEN for
# provenance; this is a new file, never an in-place edit. Loaded via load_assumptions("gb_v1_6").
#
# CM DE-RATING lineage (red-team audit, 2026-07-08, carried through gb_v1_5): the gb_v1_3 factors
# {1h: 0.40, 2h: 0.65, 4h: 0.95} overstated NESO's scaled-EFC duration de-rating ~2.3-4x. gb_v1_5
# corrected them to the modoenergy-cited Mar-2026 values {1h 0.1047, 2h 0.2094, 4h 0.4174}; this
# release re-sources them from the PRIMARY NESO CKAN de-rating resource (latest T-4 = DY 2029/30)
# — the fetched primary values win over the modoenergy secondary citation. Note for the BTM route:
# a <1MW non-exporting battery reaches the CM only inside an aggregated DSR CMU (>=1MW aggregate),
# where the generic DSR factor (~0.79-0.86) + aggregator fees apply; the storage-duration factors
# used here are the CONSERVATIVE lower bound of the two treatments.

metadata:
  market: GB
  version: gb_v1_6
  released: 2026-07-20
  currency: GBP
  notes: >-
    GB assumptions, fetcher-backed over gb_v1_5 (Revenue-Data Drive slice 4): four revenue leaves
    (CM clearing price 27.1 GBP/kW/yr, CM de-rating {1:0.1099,2:0.2198,4:0.4396}, DC/DM/DR
    28296.9 GBP/MW/yr, Piclo utilisation 135.67 GBP/MWh) re-sourced from LIVE keyless public
    fetches (NESO Data Portal CKAN, Piclo Data Hub), each transcribed from a hashed provenance
    sidecar under assumptions/provenance/gb_v1_6/, never invented. Wholesale + BM stay 0 (gated,
    source/notes rewritten only). Every other gb_v1_5 value carried forward unchanged. NOT
    confirmed - 0 confirmed repo-wide; no quote on this release is bankable; the app stays pinned
    to gb_v1_4. All prior releases stay frozen for provenance.

