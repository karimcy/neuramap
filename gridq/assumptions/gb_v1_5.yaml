    value: 175.0
    unit: GBP/kWh
    source: "PLACEHOLDER - perimeter research (BNEF ESS Cost Survey 2025: Europe turnkey avg US$177/kWh, 4h LFP installed US$180-260/kWh; NREL 2025 US$334/kWh upper anchor), recorded in docs/reviews/2026-07-03-capex-shape-research.md. Chosen inside the European installed band and reconciled to the Neura-plan all-in (see notes). Confirm against real installer quotes before ANY bankable use."
    status: placeholder
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-07-03
    notes: >-
      The ENERGY component of installed capex (C025): cells/racks/enclosures per kWh. When
      present alongside the power component, finance prices capex as power_component x MW +
      this x kWh, giving added duration real marginal capital cost - the wide-duration search
      stops pinning to the band edge. Releases without this key are byte-identical (all-in
      per-MW capex, duration unpriced).
  installed_cost_gbp_per_mw_power_component:
    value: 150000.0
    unit: GBP/MW
    source: "PLACEHOLDER - the residual that reconciles the decomposition to the sourced Neura-plan all-in at the 2-hour reference: 150,000 + 2,000 kWh/MW x GBP175/kWh = GBP500,000/MW (battery_capex.installed_cost, needs_review). Research basis: docs/reviews/2026-07-03-capex-shape-research.md."
    status: placeholder
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-07-03
    notes: >-
      The POWER component of installed capex (C025): PCS/inverter, balance of plant, EPC power
      share and grid connection, per MW. Consumed only together with
      installed_cost_gbp_per_kwh; the legacy all-in installed_cost stays as the fallback and
      the reconciliation anchor.

