# GridQ assumption library — GB, v1.5  (release: gb_v1_5)
#
# ADDITIVE over gb_v1_4 (issue 018, 2026-07-17): adds local_flex_piclo.aggregator_cut_pct — the
# aggregator / route-to-market take on gross local-flex revenue (default 0.20, placeholder). Every
# other gb_v1_4 value is carried forward UNCHANGED; the CM de-rating history below is retained.
# A per-site agreed rate (SiteModel.export_arrangement.aggregator_cut_pct) overrides this default.
#
# CM DE-RATING CORRECTION over gb_v1_3 (red-team audit, 2026-07-08) — every gb_v1_3 value is
# carried forward UNCHANGED except capacity_market.de_rating_factor_by_duration_h, which the
# audit's literature verification CONTRADICTED (docs/redteam/ASSUMPTION_REGISTER.md A8): the
# carried-forward factors {1h: 0.40, 2h: 0.65, 4h: 0.95} overstate NESO's published
# scaled-EFC duration de-rating by ~2.3-4x, inflating Capacity Market revenue by the same
# multiple. Corrected here to the scaled-EFC values applied at the Mar-2026 auctions
# (DY 2029/30 T-4 / DY 2026/27 T-1): 1h 10.47%, 2h 20.94%, 4h 41.74% (NESO 2024 Electricity
# Capacity Report methodology; per-delivery-year exact tables live on the NESO EMR Delivery
# Body Auction Guidelines page - a per-auction series, referenced not stored). Status stays
# needs_review (a per-auction table must be sourced per delivery year); the CM stream remains
# CONDITIONAL (never firm). Note for the BTM route: a <1MW non-exporting battery reaches the
# CM only inside an aggregated DSR CMU (>=1MW aggregate), where the generic DSR factor
# (~0.79-0.86) and aggregator fees apply - the storage-duration factors used here are the
# CONSERVATIVE lower bound of the two treatments. NOTHING in this release is `confirmed`; no
# quote on it may present as bankable. gb_v0_1..gb_v1_3 stay FROZEN for provenance; this is a
# new file, never an in-place edit. Loaded via gridq.assumptions.load_assumptions("gb_v1_5").

metadata:
  market: GB
  version: gb_v1_5
  released: 2026-07-17
  currency: GBP
  notes: >-
    GB assumptions, additive over gb_v1_4 (issue 018): adds local_flex_piclo.aggregator_cut_pct
    (default 0.20, placeholder) — the aggregator / route-to-market take on gross local-flex
    revenue; a per-site SiteModel.export_arrangement.aggregator_cut_pct overrides it, and absent
    both no cut is applied. Every other gb_v1_4 value (incl. the CM de-rating correction) is
    carried forward unchanged. NOT confirmed - no quote on this release is bankable. All prior
    releases stay frozen for provenance.

