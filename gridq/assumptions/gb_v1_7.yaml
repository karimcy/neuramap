    unit: minutes; MWh per MW contracted; percent; MWh/MW/yr
    source: "NESO, 'Response Services Service Terms', Version 6, effective 31 July 2026, Schedule 2 service parameters (Tsus, VmaxC, Reserved Capacity) and 'Response Services Procurement Rules', Version 6, Schedule 1 and paragraph 8.3.3.2, https://www.neso.energy/document/384606/download and https://www.neso.energy/document/384601/download; NESO, 'SOE Monitoring Guidance', V2, March 2025, Table 2 and section 3, https://www.neso.energy/document/347241/download. Throughput: author's calculation applying the Service Terms Schedule 2 delivery curves to NESO Data Portal 1-second system frequency data for January 2026 and June 2026, https://www.neso.energy/data-portal/system-frequency-data. Transcribed via docs/bess_constants_register.md."
