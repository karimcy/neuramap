    source: "National Grid Electricity Distribution, 'Guidance for Electricity Distribution Flexibility Service Providers', March 2026, Table 2.1, §3.2 and Appendix 1, https://www.flexiblepower.co.uk/downloads/1121; National Grid Electricity Distribution, 'NGED DSO - Revenue Estimator September 2025 V2.0', Overview tab, 2025, https://www.flexiblepower.co.uk/downloads/1176 (5% assumed SAOU utilisation, valid 23/09/2025-31/03/2026); UK Power Networks, 'Participation Guidance V1.2', October 2024, §3.2 and 'Competition Data - Summer 2026 Tender V2', Competition Data TR14 sheet, 2026; Scottish and Southern Electricity Networks, 'Assessment of Bids and Offers in SSEN' V2.1, April 2026, §2.1, https://www.ssen.co.uk/globalassets/our-services/flexibility-services-document-library/service-documentation/assessment-of-bids-in-ssen-v2.1-apr-2026.pdf. Transcribed via docs/bess_constants_register.md."
