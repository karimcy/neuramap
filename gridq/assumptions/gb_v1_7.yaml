      CPI-linked contracted revenue individually, and deflating consistently with the discount-rate
      basis. Two lines in this library already depend on the answer: T-4 Capacity Market prices are
      CPI-indexed from a stated base winter (see capacity_market.clearing_price_by_auction_and_delivery_year)
