    last_reviewed: 2026-08-12
    notes: >-
      The product a site can actually sell into decides whether it earns availability at all (SU and
      OU pay utilisation only), and the SERVICE WINDOW decides whether local flex collides with DUoS
      red-band avoidance and peak shaving — NGED's SU LV Evening window (16:00-20:00) overlaps the
      NGED East Midlands red band (16:00-19:00) almost exactly, so those two streams are largely the
      same half hours and must not both be booked at full value. Utilisation rates DISAGREE and are
      kept unaveraged: NGED's own revenue-estimator planning assumption is 5% of available hours
      (the tool is itself labelled an upper bound and the note says actual could be higher or
      lower), against UKPN's indicative median of 22% for the same product family. `null` minimum
      capacity for NGED means 'no threshold published', not 'zero'; SPEN and Northern Powergrid are
      unverified nulls — they procure via Flexible Power and are LIKELY aligned to NGED practice,
      but that is an inference and is not carried as a value. DATA ASK: SPEN and Northern Powergrid
      minimum offer sizes and product sheets.

