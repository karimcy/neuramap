    unit: pct of annual capacity revenue
    source: UNVERIFIED perimeter research (CMS / EMR Delivery Body summaries recorded in docs/reviews/2026-07-01-deep-review.md)
      — confirm against the Capacity Market Rules text before ANY use beyond labelled-placeholder machinery
