        other_balancing_or_dno_flex: "barred where the DFS Stacking List prohibits it (4.7.9)"
        capacity_market: "permitted unless otherwise stated in the DFS Stacking List (4.7.8(a))"
      metering: "I&C Boundary Meters must be Half-Hourly Settled unless Profile Class 3 or 4 (4.7.2); Code of Practice 11 accuracy class (4.7.7)"
      zone_names: null
    unit: MW; count
    source: "NESO, 'Demand Flexibility Service Procurement Rules', v5.0, effective 18 May 2026, Schedule 1 and paras 4.2, 4.3.2(k), 4.7.2, 4.7.6, 4.7.7, 4.7.8, 4.7.9, 4.10, https://www.neso.energy/document/379391/download — Registered Unit Capacity must be 'an amount (if not an integer, rounded to one decimal place) from and including zero point one (0.1) MW to and including one hundred (100) MW'. Zone count: NESO, 'DFS 12 Zones GeoJson Map', https://www.neso.energy/document/376656/download. Transcribed via docs/bess_constants_register.md and docs/bess_modelling_requirements.md E-06."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      DFS IS THE ONLY DIRECT NESO REVENUE ROUTE BELOW 1 MW (E-06), so omitting it makes the model
      conclude that a 0.1-1 MW behind-the-meter battery earns zero NESO revenue — false since the
      9 April 2026 service expansion. But it is CONDITIONALLY EXCLUSIVE with the rest of the stack,
      and the governing document is the DFS Stacking List, not 'Primacy' (Primacy is a DNO
      conflict-EXCLUSION process, not a general stacking resolver). Registration therefore has to
      be a gate evaluated BEFORE revenue is booked, and DFS participation is mutually exclusive
      with BM participation for the same meter point. zone_names IS DELIBERATELY NULL: the register
      confirms there are 12 zones and cites the GeoJSON map, but carries neither the zone names nor
      their boundaries, so a site cannot yet be allocated to a zone. DATA ASK: the DFS 12 Zones
      GeoJSON (zone names plus boundaries, or a GSP-Group-to-zone mapping). Also note the Zonal Cap
      per zone 'may be zero (0) MW', so a zone can be open with no procurable volume.
  dfs_performance_factor_k_piecewise:
    value:
      settlement_formula: "S_ie = 0.5 * P_ie * Q_ie * K_ie"
      realised_volume_pct: "RV = 100 * V / (Q * 0.5), V = DFS Settlement Volume MWh delivered against baseline, Q = OFFERED Service Volume MW"
      k_schedule:
        - {condition: "RV >= 120", k: 1.2}
        - {condition: "50 <= RV < 120", k: "0.01 * RV"}
        - {condition: "25 <= RV < 50", k: "0.01 * (2 * RV - 50)"}
        - {condition: "0 <= RV < 25", k: 0.0}
        - {condition: "-100 <= RV < 0", k: "0.01 * RV"}
        - {condition: "RV < -100", k: -1.0}
      utilisation_price_basis: "P = the Utilisation Price from the accepted DFS Bid, in GBP/MWh with pounds and pence each an integer; submissions are NOT curtailable, so acceptance is binary per submission; clearing ranks bids low to high until the zonal requirement is met without exceeding the Zonal Cap"
      baseline_options: "P376 BL01 historic baseline (average of up to ten most recent like Working Days from a 60-day window, excluding Event Days and clock-change days, no in-day adjustment) OR the Self-Nominated Baselining Methodology (I&C and Generation Asset meter points only, never Domestic)"
      historic_price_anchor_gbp_per_mwh: 4559
    unit: dimensionless (K); GBP/MWh (P); MW (Q)
    source: "NESO, 'Demand Flexibility Service Service Terms', v4.0, effective 9 April 2026, Schedule 1 (Utilisation Payments), https://www.neso.energy/document/379396/download; NESO, 'Demand Flexibility Service Procurement Rules', v5.0, 18 May 2026, paras 11.5 (submission format), 12 (assessment and clearing), 12.3 (non-curtailable), Schedule 3 Parts 2-4 (BL01 and Self-Nominated Baselining), https://www.neso.energy/document/379391/download. Historic anchor: Cornwall Insight for National Grid Electricity Distribution, 'Revenue Stacking for Flexibility', December 2023, Figure 4, https://www.flexiblepower.co.uk/downloads/1150 — DFS average 2022-23 live event price. Transcribed via docs/bess_constants_register.md."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      Payment is on OFFERED volume Q scaled by performance K, so under-delivery is penalised through
      K, not through a reduced Q. K IS NEGATIVE below zero realised delivery, reaching -1: any model
      that clips K at zero understates the downside, and there is a DEAD ZONE where delivering
      0-25% of contracted volume earns exactly zero. The 1.2 cap pays a 20% over-delivery bonus.
      THE PRICE IS A BID, NOT A LIBRARY CONSTANT: no current DFS utilisation price is carried, and
      the £4,559/MWh historic anchor is a 2022-23 average live-event price under the PREVIOUS
      scheme, kept only as an order-of-magnitude marker — it must NOT be used as a forward price
      for the post-April-2026 zonal service. BASELINE CHOICE IS MATERIAL for a battery behind a
      variable C&I load: the BL01 historic baseline is contaminated by the battery's own prior
      dispatch, which is exactly why the Self-Nominated option exists; model both and take the
      higher expected K. DATA ASK: the Schedule 1 Guaranteed Acceptance Price and a current cleared
      DFS utilisation price distribution by zone.

