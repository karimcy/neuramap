    source: "docs/bess_degradation_requirements.md Constants table row 'SoC window, optimisation | 15-95 % | case-study assumption | 2017 | Xu et al. 2017' (arXiv:1709.05715; IEEE Trans. Smart Grid). Corroborated on usable depth (80%) by Mongird, K. et al. 2020, PNNL, 'Usable DoD, planning | 80 % | LFP and NMC, all durations'. Conflicting published window kept, NOT averaged: Carmona, R., Yang, X., Bhela, S., Zeng, C. 2024, arXiv:2409.03942 §3.1 use SOC in [0.20, 0.96] on a real PSE&G/PJM microgrid. docs/bess_modelling_requirements.md D-169 illustrates 0.10-0.95 and requires the bound be 'set from the OEM warranty, not from first principles'."
