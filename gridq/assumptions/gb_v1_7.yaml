# GridQ assumption library — GB, v1.7  (release: gb_v1_7)
#
# REGISTER-BACKED over gb_v1_6 (Tier A remediation, 2026-08-12): this release adds the constants the
# open Tier A findings need, every one transcribed from docs/bess_constants_register.md (422 sourced
# constants) or docs/bess_degradation_requirements.md, with the primary source and vintage carried
# through verbatim. NOTHING here is invented: where the register does not hold a figure, the KEY is
# added with a null value and `status: needs_review` plus the exact data ask, so the code can find it
# and warn instead of silently defaulting.
#
# ONE value drifts from gb_v1_6 (see DEG-01 below):
#   - battery_opex.degradation_marginal_cost_gbp_per_mwh   5.0 -> 21.3   (£/MWh discharged)
# Every OTHER gb_v1_6 value is carried forward BYTE-IDENTICAL, including the whole capex/opex stack.
# Capex and opex were deliberately NOT re-based: the register's grid-scale benchmarks
# (£580k/MW survey, ~£24.6k/MW/yr implied opex) both carry an explicit "not transferable to
# 0.1-5 MW behind-the-meter" caveat, so they are landed as SEPARATE reference-only benchmark keys and
# `battery_capex.installed_cost` / `battery_opex.annual_fixed_opex` keep their values AND their
# statuses. Note the opex benchmark points UPWARD (~2x the 12,000 placeholder): leaving the
# placeholder is not conservative, it is optimistic, and it is flagged rather than tuned.
#
# DEG-01 (the one drift) — the MILP objective carries no degradation term at all, so the modelled
# break-even arbitrage spread is ~£11.4/MWh against a true ~£32.7/MWh (~65% too low). The flat
# £/MWh wear cost is re-based from gb_v1_6's unsourced illustrative 5.0 to the levelised C-34 figure
# 21.3 £/MWh discharged = C_repl / (N_EFC,EOL x eta_dis) = 120,000 / (6,000 x 0.94). READ THE NOTES
# ON THAT KEY BEFORE WIRING IT: finance ALREADY deducts this key post-hoc as an annual cost line, so
# putting the same number in the dispatch objective charges wear ONCE for dispatch selection and must
# not also be double-deducted in the cashflow. The flat value is calibrated at deep-cycle depth and
# overcharges shallow cycling ~8x (C-35) — the depth-aware form needs
# degradation.cycle_depth_stress_coefficients.
#
# SCHEMA LIMITS FOUND WHILE CUTTING THIS RELEASE (LIT-A-02, verified empirically against
# src/gridq/assumptions/models.py at this commit — no src/ change was made):
#   - `Assumption.value` is `Any` (models.py:36), so a nested, dated, per-region schedule IS
#     expressible inside `value` (proven by loading one). It is NOT validated: `Any` accepts a typo'd
#     inner key silently. Every nested shape below is therefore a CONVENTION, documented in `notes`.
#   - Sibling effectivity FIELDS on an Assumption (valid_from / valid_to / season) are REJECTED
#     (`GridQModel` extra='forbid', models.py:29-43). Effectivity is carried INSIDE `value` instead.
#   - A NEW top-level section is REJECTED unless it is added to the model. So two keys the
#     remediation brief named could not use their requested path and were placed in an existing
#     section instead:
#       macro.cpi_pct_per_year          -> financing.cpi_pct_per_year
#       battery.soc_min/max_fraction    -> warranty_cycle_limits.soc_min/max_fraction
#     (the second is the better home anyway: the SoC window is a warranty operating envelope, C-29).
#
# CM DE-RATING — PROPORTIONALITY WARNING. gb_v1_6 carries one duration-only table for the latest T-4,
# which happens to be EXACTLY duration-proportional (0.1099/h at 1/2/4h). That property does NOT
# generalise: of the 18 published auction x delivery-year combinations now carried in
# capacity_market.de_rating_by_auction_and_delivery_year, only 2 are exactly proportional at 1/2/4h
# (2029-30 T-4 and 2026-27 T-1); 16 break it, up to -0.41 absolute (2019-20 T-1: 4h = 0.9552 against
# 4 x 0.3421 = 1.3684). Even inside the 2029-30 T-4 curve the half-hour bins deviate by +/-0.0008 and
# the 6h/8h bins by +/-0.0015. Any reasoning that relies on exact duration-proportionality holds only
# for the single integer-hour subset gb_v1_6 happened to carry.
#
# STATUS DISCIPLINE unchanged: 0 `confirmed` repo-wide, by design. No quote on this release may
# present as bankable. gb_v0_1..gb_v1_6 stay FROZEN for provenance; this is a new file, never an
# in-place edit. Loaded via load_assumptions("gb_v1_7"). Cutting it makes it latest_version(), so it
# becomes the CLI default (MD-F-15 fix) — golden fixtures pinned to an older default may move.

metadata:
  market: GB
  version: gb_v1_7
  released: 2026-08-12
  currency: GBP
  notes: >-
    GB assumptions, register-backed over gb_v1_6 (Tier A remediation): adds the constants the open
    Tier A findings need — a marginal degradation cost in the dispatch objective (DEG-01), the SoC
    operating window (D-169), published fleet availability distinct from degradation (H-17), the
    per-licence-area CDCM DUoS band windows (LIT-F-05, 1 of 14 areas sourced, 13 named as missing),
    Capacity Market de-rating and clearing prices keyed by auction type AND delivery year (D-25),
    ENA Open Networks local-flex settlement mechanics (D-116), DC/DM/DR settlement K/F and EFA-block
    prices (D-158), DFS registration and settlement (E-06), and the 1 MW eligibility thresholds plus
    the same-GSP-Group aggregation rule (D-92). Every value is transcribed from
    docs/bess_constants_register.md or docs/bess_degradation_requirements.md with its primary source
    and vintage; unsourced constants are landed as null-valued needs_review homes carrying the data
    ask. Exactly ONE value drifts from gb_v1_6 (degradation_marginal_cost_gbp_per_mwh 5.0 -> 21.3);
    capex and opex are untouched by design. NOT confirmed - 0 confirmed repo-wide; no quote on this
    release is bankable. All prior releases stay frozen for provenance.

