    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      THE PUBLISHED WARRANTY ENVELOPE, landed because max_cycles_per_year_by_duration_h carries no
      source at all and these are the market terms it should be reconciled against. Sanity check:
      365 cycles/yr at 2 h duration is 1.0 cycles/day (the conservative end of typical) and 548 at
      1 h is 1.5/day (the bottom of the observed range) — so the existing per-duration caps are
      inside, and at the tight end of, the published envelope. revenue_impact is carried as the
      published +/-10-20% RANGE, not a midpoint (the register's rule: nothing is averaged), and is
