  performance_factor_k_parameters:
    value:
      k_piecewise: "k_j = 1 if E < A; k_j = 1 - (E - A)/(B - A) if A <= E <= B; k_j = 0 if E > B"
      block_factor: "K_e = min over all settlement-period k_j in the contracted service period (the MINIMUM, not the mean)"
      settlement_formula: "S_aij = Round(((P_aj - ((1 - K_aij * F_aij) * PF_aj)) * V_aij * 0.5), 2), with PF = max(market clearing price, Minimum Adjustment Price)"
      minimum_adjustment_price_gbp_per_mw_h: 1.0
      error_thresholds:
        DC: {A: 0.03, B: 0.07}
        DM: {A: 0.03, B: 0.07}
        DR: {A: 0.05, B: 0.25}
        DR_stacked_with_DC_or_DM: {A: 0.03, B: 0.07}
      rolling_minimum_error_window_s:
        DC: 0.2
        DM: 0.2
        DR: 2.0
      grace_period_error_tolerance_scaled: 0.25
      assumed_realised_k: null
    unit: dimensionless (k, K, A, B); GBP/MW/h; seconds
    source: "NESO, 'Response Services Service Terms', Version 6, effective 31 July 2026, Schedule 2 service parameter table and Schedule 3 (K factor calculation, performance bounds, Minimum Adjustment Price), https://www.neso.energy/document/384606/download. Corroborated by NESO, 'Dynamic Response Services - Provider Guidance', v14, June 2026, slides 18-19, https://www.neso.energy/document/276606/download. Transcribed via docs/bess_constants_register.md."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      REPLACES contracted MW x clearing price x hours (D-158). Two multiplicative haircuts, both
      cliff-shaped: K (performance) and F (availability, see availability_factor_f_threshold_pct).
      K_e takes the MINIMUM k across the block, so ONE degraded settlement period sets the payment
      for the whole four-hour block — an annual availability scalar cannot represent this. Stacking
      TIGHTENS tolerances: the lowest A and B apply, so stacking DR with DC moves DR from 5%/25% to
      3%/7%. Because PF is floored at the £1/MW/h Minimum Adjustment Price, a total performance
      failure on a product that cleared below £1/MW/h (or negative — DMH and DRH routinely clear
      negative) results in a NET PAYMENT FROM THE PROVIDER TO NESO: the downside is not bounded at
      zero revenue. Non-delivery liability is capped per Response Contract at the greater of
      £250,000 and the aggregate availability payments for the contracted service period.
      assumed_realised_k IS DELIBERATELY NULL: the register carries the FORMULA parameters but no
      published distribution of realised K for GB batteries, so no expected value can be sourced.
      The nearest published proxy is Modo Energy's GB calibration decomposition (availability ~5%,
      capacity degradation ~3%, imperfect foresight ~10%), which is not K. DATA ASK: a published or
      own-fleet distribution of realised per-settlement-period k and block K_e from 20 Hz
      performance data.
  availability_factor_f_threshold_pct:
    value:
      threshold_pct: 99.9
      equivalent_unavailability_seconds_per_settlement_period: 1.8
      behaviour: "F = 0 for the ENTIRE settlement period if availability < 99.9%; F = 1 if >= 99.9%"
      performance_data_rate_hz: 20
      rows_per_settlement_period_at_20hz: 36000
      deemed_unavailable_if: "EDL communication fails for 10 or more consecutive minutes, or two consecutive Connection Indicators are missed"
    unit: percent; seconds; Hz
    source: "NESO, 'Response Services Service Terms', Version 6, effective 31 July 2026, Schedule 3 definition of F, and paragraphs 6.5, 15.1-15.11 (telemetry obligations), https://www.neso.energy/document/384606/download; NESO, 'Dynamic Response Services - Provider Guidance', v14, June 2026, slides 19-20 — 'if a unit has an availability of less than 99.9% then availability factor will be 0 for that settlement period'. Transcribed via docs/bess_constants_register.md."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      THE CLIFF (D-158): 1.8 seconds of unavailability — individually or in aggregate — zeroes the
      whole 30-minute settlement period, and because K_e is the minimum k across the block, a
      zeroed period can carry into the block payment. This is why frequency-response revenue cannot
      be de-rated by an annual availability scalar such as availability.fleet_availability_pct;
      that scalar is for energy and payment volumes (H-17), not for F. Availability is computed
      from 20 Hz data (36,000 rows per settlement period), and a comms failure alone (10
      consecutive minutes of EDL loss, or two missed Connection Indicators) is deemed
      unavailability — so the telemetry link is a revenue-critical asset, not IT overhead.
