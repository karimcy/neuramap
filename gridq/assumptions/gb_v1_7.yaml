      AN EMPTY HOME, per the D30 convention (H-15 / N13). The KEY exists so escalation machinery can
      resolve it and warn instead of hard-coding a rate; the VALUE is a Tier B human decision and is
      NOT supplied here. Three separate choices are required and none is a library constant: (1)
      WHICH INDEX — CPI, RPI, CPIH, or a contractual percentage (CEPA deflates at CPI, Ofgem at
      CPIH against the BoE 2% target; the two frameworks are not interchangeable); (2) WHICH RATE —
      1.95% (OBR 15-yr CPI), 2.22% (RPI), 2.13% (GDP deflator), or the 2.0% BoE target; (3) WHICH
