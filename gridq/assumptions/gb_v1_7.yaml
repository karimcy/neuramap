    unit: percent (grace, taper); dimensionless (multiplier); formula
    source: "Energy Networks Association Open Networks, 'Standardised DNO Settlement Methodology', Version 1.0, August 2024, §4.1 and Table 4, https://www.flexiblepower.co.uk/downloads/1124; National Grid Electricity Distribution, 'Guidance for Electricity Distribution Flexibility Service Providers', March 2026, Table 6.1, https://www.flexiblepower.co.uk/downloads/1121; UK Power Networks, 'Participation Guidance V1.2', October 2024, §6.1 'Availability payment performance adjustments', https://d1lf1oz5vvdb9r.cloudfront.net/app/uploads/2024/10/Participation-Guidance-V1.2.pdf. Transcribed via docs/bess_constants_register.md and docs/bess_modelling_requirements.md D-116/D-117."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      REPLACES availability_price x MW x hours (D-116) and utilisation_price x MWh (D-117). The
      whole month's availability payment is conditional on delivery performance during that month's
      utilisation events: at a 5% Grace Factor and Performance Multiplier of 3, delivering 80% pays
      50%, and delivery at or below 63% pays ZERO. A single badly-delivered event can therefore
      wipe a material fraction of a month's availability revenue — the clawback is multiplicative,
      not additive. Assessment is per metered period (often per minute), so intra-event variability
      is penalised harder than an event-average calculation suggests, and over-delivery is unpaid
      and non-compensating (POD 0% for every product in the register). Empirical base rates for the
      same DNO: >90% of instructed volume delivered on average, 84.9% of events achieved 95-100% of
      target, and 6% of agreed delivery events failed to respond at all — so MPF < 1 is the normal
      case, not the exception. `null` for a grace factor means the product has none published (NGED
      records availability grace as N/A for SU and OU), never zero. Individual DNOs may set the
      Grace Factor at their discretion under the ENA methodology: re-read the product sheet each
      tender round. SPEN and Northern Powergrid were not separately verified.
