    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      THE ENERGY COST OF AN 'AVAILABILITY-ONLY' SERVICE, and the link between the ancillary stream
      and the degradation cost. Response Energy Volume = contracted MW x delivery duration is a
      WRITTEN RULE, not a modelling convenience: it ties sellable MW to available MWh, which is why
      duration is an optimisation output. Energy Recovery (20% of REV per settlement period) and
      Reserved Capacity (10/20/40% of offered quantity) both consume headroom that would otherwise
      serve arbitrage or peak shaving in the SAME settlement period — they must be reserved, not
      merely tracked. Throughput is the critical figure for the cycles-versus-arbitrage trade-off:
      DR moves ~20x the energy of DC, and a 2-hour battery fully contracted on DRL takes ~640
      equivalent full cycles per year FROM THE SERVICE ALONE, before any arbitrage. Priced at
      battery_opex.degradation_marginal_cost_gbp_per_mwh, that wear is material against the
      DRL clearing price. Throughput figures are annualised from single months (so seasonal) and are
      quasi-steady-state; DR's 10 s ramp will slightly attenuate the true figure. Net state-of-
      energy drift for a symmetric position reaches +/-1.5 MWh per 4-hour block per MW on DR, which
      is 75% of a 1 MW / 2 MWh unit's usable capacity within one block.
