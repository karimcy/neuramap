battery_opex:
  annual_fixed_opex:
    value: 12000
    unit: GBP/MW/yr
    source: "No citable source identified (W4-3 review 2026-06-24); carried forward from gb_v0_1 as an unconfirmed placeholder. See docs/assumptions_to_source.md."
    status: placeholder
    owner_or_reviewer: Oli
    confidence: low
    last_reviewed: 2026-06-24
    notes: Fixed O&M placeholder; excludes energy/levy costs (those are dispatch-driven). Source from real O&M contracts / benchmark library. UNCHANGED in gb_v1_7 by design — see annual_fixed_opex_grid_scale_benchmark, which suggests this placeholder is roughly HALF a plausible figure (i.e. optimistic, not conservative).
  annual_fixed_opex_grid_scale_benchmark:
    value:
      implied_gbp_per_mw_yr:
        "2024": 22400
        "2025": 24600
      insurance_pct_of_system_value_per_year:
        low: 0.5
        high: 3.0
      insurance_gbp_per_year_1mw_indicative:
        low: 5000
        high: 30000
    unit: GBP/MW/yr; percent of insured value per year; GBP/yr (grid-scale reference only)
    source: "DERIVED from Gresham House Energy Storage Fund plc, 'Annual Report and Financial Statements 2025', 2026, https://greshamhouse.com/wp-content/uploads/2026/04/GRID-Annual-Review_25_20.04-FINAL.pdf — revenue £68,600/MW/yr at a 64.2% EBITDA margin (2025) and £59,800/MW/yr at 62.5% (2024), 1,072 MW GB portfolio; covers O&M, insurance, business rates, land rent, optimiser fees and portfolio operating costs. Insurance range: Solarif, 'How much does battery storage fire insurance cost?', https://solarif.com/academy-article/how-much-does-battery-storage-fire-insurance-cost/ (LOW AUTHORITY — broker marketing). Transcribed via docs/bess_constants_register.md."
    status: needs_review
    owner_or_reviewer: Oli
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      REFERENCE ONLY — never the opex input, and deliberately NOT used to re-base
      annual_fixed_opex. Derived (not published as an opex figure) from a grid-scale portfolio; the
      register's caveat is explicit that a 0.1-5 MW site should expect a materially HIGHER £/MW
      figure. The direction matters: ~£24.6k/MW/yr against the 12,000 placeholder means the
      library's opex is likely understated by ~2x or more, which flatters every quote. Flagged for
      the human, not silently changed. Note the double-count risk with the separate `insurance` and
      `business_rates` sections — this benchmark is all-in and those are additive.
  degradation_marginal_cost_gbp_per_mwh:
    value: 21.3
    unit: GBP/MWh discharged (AC, at the meter)
    source: "docs/bess_degradation_requirements.md C-34 (levelised form) and its Constants table row 'Derived c_deg (worked example) ~21.3 £/MWh discharged | £120k/MWh, 6,000 EFC, eta_dis 0.94 | derived, C-34'. Formula c_deg = C_repl / (N_EFC,EOL x eta_dis), following Reniers et al. 2018 (Journal of Power Sources) and Xu et al. 2017 (IEEE Trans. Smart Grid, arXiv:1709.05715). REPLACES gb_v1_6's unsourced illustrative 5.0. The C_repl input (£120,000/MWh = £120/kWh) is a worked-example figure, corroborated in order of magnitude by the register's derived 2025 energy-capex component of ~£105/kWh (Modo 'Modelling Assumptions', July 2026 vintage, https://docs.modoenergy.com/pages/jul-2026/uk-europe/model-assumptions/) — at £105/kWh the same formula gives £18.6/MWh."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      THE FLAT MARGINAL WEAR COST PER MWh DISCHARGED. Basis: LEVELISED cycle-wear only (C-34) — it
      is NOT a calendar-fade cost (calendar fade is degradation.annual_capacity_fade_pct and the
      exponents in degradation.ageing_exponents) and it is per MWh of THROUGHPUT, not per cycle.
      CHARGE IT ONCE. Finance already deducts this key post-hoc as an annual cost line (= value x
      annual discharge MWh) while the MILP's ObjectiveWeights default to 0.0, so the optimiser
      cannot currently see a cost the cashflow then subtracts. Wiring it into the dispatch
      objective makes the same £ appear in two places: the objective must use it as the dispatch
      signal and the cashflow must deduct it exactly once. DEPTH: the value is calibrated at deep
      cycling; per C-35 a flat adder overcharges shallow cycling by ~8x at delta=0.1 versus
      delta=0.8 and undercharges the deep tail — use degradation.cycle_depth_stress_coefficients
      for the depth-aware marginal form. SENSITIVITY: c_deg scales linearly in C_repl and the
      published C_repl range spans 6x ($300/kWh Xu 2017, $600/kWh Shi 2017, £500/kWh Uddin 2017 via
      Butt & Verba 2026), so this is the single most likely source of a wildly wrong number. Stays
      needs_review: a sourced, dated C_repl with a stated basis (cell / module / full system) and an
      N_EFC,EOL taken at the modelled depth would settle it.
  arbitrage_breakeven_spread_check_gbp_per_mwh:
    value: 32.7
    unit: GBP/MWh (required discharge-minus-charge spread)
    source: "docs/bess_degradation_requirements.md C-36: Delta_p_min = p_charge x (1/eta_RT - 1) + c_deg = 70 x (1/0.86 - 1) + 21.3 = 11.4 + 21.3 = 32.7 £/MWh, at p_charge £70/MWh and eta_RT 0.86 (the PNNL AC-AC figure, Mongird et al. 2020, 'Grid Energy Storage Technology Cost and Performance Assessment', PNNL). Corroborated by docs/reviews/2026-08-12-findings-register.md §5 (DEG-01)."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      A POST-SOLVE ASSERTION REFERENCE, never a price and never a revenue input. C-36 requires
      asserting p_discharge >= p_charge/eta_RT + c_deg(delta) on every round trip; if the optimiser
      is charging trades below this spread then either c_deg is absent from the objective (DEG-01)
      or it is applied to the wrong variable. The 32.7 figure is only valid AT the stated p_charge
      (£70/MWh) and eta_RT (0.86): recompute per site from the actual charge price rather than
      treating 32.7 as a constant. An efficiency-only model sets the bar at 11.4 £/MWh — 65% too
      low — and books every trade in the 11.4-32.7 band as profitable when it is loss-making.
  parasitic_load_fraction_of_power:
    value: 0.01
    unit: fraction_of_rated_power
    source: "PLACEHOLDER — illustrative auxiliary (HVAC/BMS/controls) draw as a fraction of rated power (goal workstream, 2026-07-02); no citable source. Real basis = OEM datasheet auxiliary consumption at site operating conditions. See docs/assumptions_to_source.md."
    status: placeholder
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-07-02
    notes: >-
      Continuous parasitic draw of the BESS itself, previously omitted entirely. When this key
      is present the dispatch reduces the connection charge headroom by fraction x rated power
      (the auxiliary draw occupies import capacity on top of site load, disclosed via a solver
      warning) and finance prices an annual auxiliary-energy cost line from the same fraction
      (disclosed, placeholder-labelled). Releases without the key are unchanged (no headroom
      reduction, no cost line - absent, not zero). Any case using it stays not bankable until
      confirmed against the OEM datasheet.

degradation:
  annual_capacity_fade_pct:
    value: 2.5
    unit: percent_per_year
    source: "No citable source identified (W4-3 review 2026-06-24); carried forward from gb_v0_1 as an unconfirmed placeholder. Source = OEM datasheet/warranty. See docs/assumptions_to_source.md."
    status: placeholder
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-06-24
    notes: >-
      Calendar+cycle fade proxy. Day-one sizing must hold end-of-life capability (no augmentation).
      Provenance relabel by the X.1 librarian, not an Olly review — confirm against the cell/OEM
      datasheet and warranty fade curve.
  ageing_exponents:
    value:
      calendar_time_exponent_p_nmc: 0.75
      calendar_time_exponent_p_lfp: 0.5
      cycle_throughput_exponent_q: 0.5
    unit: dimensionless exponents
    source: "docs/bess_degradation_requirements.md C-01/C-02/C-03 and its Constants table: p = 0.75 (NMC, Li(NiMnCo)O2 18650, 2014) Schmalstieg et al. 2014 via Reniers et al. 2018; p ~ 0.5 (LFP/graphite commercial cell, 2018) Naumann et al. 2018 (register marks this row as not re-fetched in-session); q = 0.5 (both NMC and LFP semi-empirical models, 2014-2020) Schmalstieg 2014 / Naumann 2020 via Reniers 2018."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      THE CALENDAR-VS-CYCLE SPLIT the degradation cost must respect (C-01): total fade is an
      ADDITIVE calendar term in t^p plus a cycle term in Ah^q, never one blended annual number.
      Both exponents are SUB-LINEAR, so a linear-in-time or linear-in-throughput fade model
      overstates early fade and understates late fade. Chemistry matters: pick p by chemistry, and
      note the LFP row is the weaker citation. These exponents describe FADE, not cost — the cost
      per MWh is battery_opex.degradation_marginal_cost_gbp_per_mwh and the depth dependence is
      cycle_depth_stress_coefficients.
  cycle_depth_stress_coefficients:
    value:
      k4: 0.000524
      k5: 2.03
      stress_function: "Phi(delta) = k4 * delta ** k5"
      marginal_form: "c_deg(delta) = R * k4 * k5 * delta ** (k5 - 1) / eta_dis, R in GBP/MWh of rated energy"
      alternative_k4_k5:
        k4: 0.00045
        k5: 1.3
      relative_marginal_cost_delta_0_8_vs_0_1: 8.55
    unit: dimensionless (k4, k5); GBP/MWh discharged for c_deg(delta)
    source: "docs/bess_degradation_requirements.md C-35 and its Constants table: k4, k5 = 5.24e-4, 2.03 for Li(NiMnCo)O2 18650 lab tests (2017-2018) — Xu, B., Oudalov, A., Ulbig, A., Andersson, G., Kirschen, D. 2017 (IEEE Trans. Smart Grid, arXiv:1709.05715) and Shi, Y., Xu, B., Tan, Y., Kirschen, D., Zhang, B. 2017 (arXiv:1709.05715v2); alternative planning-case-study pair 4.5e-4, 1.3 from Shi et al. 2017. The 8.55x ratio is derived in C-35 as (0.8/0.1)^1.03."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      THE DEPTH-AWARE MARGINAL WEAR COST (C-35), for the piecewise-linear objective term (C-16).
      Phi is convex at k5 = 2.03, so the marginal cost of the next MWh depends on how deep the
      current half-cycle already is: the marginal cost at delta = 0.8 is 8.55x that at delta = 0.1.
      A flat adder calibrated on one deep cycle per day therefore SUPPRESSES shallow, high-value
      frequency-response duty while UNDERCHARGING the deep tail. NMC parameterisation from lab
      cells; the register keeps the alternative (k4 4.5e-4, k5 1.3) rather than averaging. LFP
      coefficients exist separately (Naumann 2020 delta 4.0253, c 1.0923 via Butt & Verba 2026) and
      are NOT carried here because they parameterise a different functional form.
  degradation_cost_basis:
    value:
      formula: "c_deg = C_repl / (N_EFC_EOL * eta_dis)"
      c_repl_gbp_per_mwh_rated: 120000
      n_efc_to_eol: 6000
      eta_discharge: 0.94
      c_deg_gbp_per_mwh_discharged: 21.3
      calibrated_at_cycle_depth: 0.8
      published_c_repl_alternatives:
        xu_2017_usd_per_kwh: 300
        shi_2017_usd_per_kwh: 600
        uddin_2017_gbp_per_kwh: 500
        register_derived_energy_component_2025_gbp_per_kwh: 105
      published_efc_to_eol_ranges:
        lfp_to_80pct_soh_20_80_window: "3,500-5,000 EFC (Preger et al. 2020)"
        warranty_cycle_caps_2025: "10,000-12,000 cycles (DNV 2025)"
    unit: mixed (see keys); c_deg in GBP/MWh discharged
    source: "docs/bess_degradation_requirements.md C-34 (formula and worked GB example), C-37 (replacement-cost basis and its 6x published range: Xu et al. 2017 US$300,000/MWh; Shi et al. 2017 US$0.6/Wh; Uddin et al. 2017 £500/kWh via Butt & Verba 2026) and the Constants table rows 'Cost basis for the degradation term'. EFC ranges: Preger, Y. et al. 2020 (Sandia, 'Degradation of Commercial Lithium-Ion Cells as a Function of Chemistry and Cycling Conditions'); DNV, 'Financing the energy transition: building bankable battery projects'. Energy-capex comparator via docs/bess_constants_register.md (Modo 'Modelling Assumptions', July 2026 vintage)."
    status: needs_review
    owner_or_reviewer: Olly
    confidence: low
    last_reviewed: 2026-08-12
    notes: >-
      THE AUDIT TRAIL for battery_opex.degradation_marginal_cost_gbp_per_mwh — kept as one entry so
      the flat number can never be quoted without its inputs. Two of the three inputs are
      worked-example choices, not published points: C_repl £120,000/MWh (nearest published GB
      comparator ~£105/kWh energy-capex component, 2025 real) and N_EFC,EOL 6,000 (published LFP
      EFC-to-80% at a 20-80% window is 3,500-5,000; warranty cycle caps are 10,000-12,000 on a
      different, heavily disclaimed basis). eta_dis 0.94 is the worked-example discharge
      efficiency; the library's AC round-trip is round_trip_efficiency.ac_round_trip. C-37 requires
      C_repl to mean the SAME thing as the capex strategy: added cells/racks at forward prices if
      augmenting, amortised residual value if running to EOL and decommissioning. Neither is chosen
      here. WHAT WOULD SETTLE IT: one dated OEM/EPC replacement quote (£/kWh, stated basis) plus
      the warranty's EFC-to-EOL at the modelled depth and C-rate.

round_trip_efficiency:
  ac_round_trip:
