    last_reviewed: 2026-08-12
    notes: >-
      LOWER OPERATING SoC BOUND (D-169): enforce soc_min <= E[t]/E_max <= soc_max at every half
      hour, strictly inside 0-100%, plus the terminal condition E[T] >= E[0] so the optimiser
      cannot finance the last day by emptying the battery. This pair gives an 80% usable window,
      matching PNNL's 80% planning DoD from an independent source. IT IS NOT AN OEM WARRANTY TERM:
      the register holds no OEM/BMS reserve figure, and this release's own
      max_cycles_per_year_by_duration_h is itself an unsourced placeholder, so there is no warranty
      envelope in the library to derive it from. The published alternatives disagree (0.20-0.96
      Carmona, the more conservative usable window; 0.10-0.95 in D-169's illustration). WHAT WOULD
      SETTLE IT: the specific unit's OEM warranty operating envelope / BMS reserve, which C-29
      requires be implemented as hard dispatch constraints.
