      standalone behind-the-meter battery below 1 MW from the Capacity Market unless it is
      aggregated into a multi-site DSR CMU (see dsr_de_rating_by_auction_and_delivery_year).
      Related gates that are NOT capacity thresholds and are not carried as constants: the
      nominated Connection Capacity floor of 50% of the Rule 3.5.2/3.5.5 value (Rule 3.5.6(b)),
      which bounds duration-bin gaming to at most a doubling of declared duration; and the capex
      thresholds that set agreement length (2029/30 T-4: 15-year £350/kW, 9-year £205/kW, 3-year
      £65/kW, all per DE-RATED kW — getting that denominator wrong flips a project from a 15-year
      to a 3-year agreement).

