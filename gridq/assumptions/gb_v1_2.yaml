# GridQ assumption library — GB, v1.2  (release: gb_v1_2)
#
# RELEASE-NUMBER NOTE (2026-07-02): originally cut as gb_v1_1 in the goal session; renumbered
# to gb_v1_2 because the north-star drive (karim/north-star-drive, its D30) cut its OWN
# gb_v1_1 (availability / penalties / tnuos optional-section content) first and that branch
# is authoritative. RE-CUT AT MERGE (same day): this file is now a strict SUPERSET of
# gb_v1_1 — its availability / penalties / tnuos sections are carried forward verbatim at the
# end of this file — so a gb_v1_2 quote never loses the W8 penalty line relative to gb_v1_1.
#
# DEBT-STRUCTURE PASS over gb_v1_0 (goal workstream, 2026-07-02). All gb_v1_0 values are
# carried forward UNCHANGED. This release adds exactly four entries, every one a labelled
# placeholder (never a bankable figure):
#   (1) financing.debt_gearing_pct — illustrative gearing so the P90-DSCR machinery and the
#       covenant gate are exercisable in real (non-injected-debt) mode; pending Sim's
#       portfolio finance work (BLOCKERS B001).
#   (2) financing.credit_rate_tenor_policy — the D18 credit-band -> rate/tenor policy table,
#       folded in from gb_v0_1 per decision D19 ("the next release must fold it in") so the
#       M9 mapping resolves rate/tenor on this release.
#   (3) battery_opex.degradation_marginal_cost_gbp_per_mwh — a per-MWh throughput wear cost
#       line, previously omitted entirely (the cap-only treatment); illustrative placeholder
#       pending the OEM warranty schedule / M7 SoH model.
#   (4) battery_opex.parasitic_load_fraction_of_power — the BESS's own continuous auxiliary
#       draw (F-007): dispatch reserves connection headroom for it and finance prices it as
#       a blended-rate cost line; illustrative placeholder pending the OEM datasheet.
# NOTHING here is `confirmed`. Do NOT present any quote built on this release as bankable.
# The gaps — ranked by impact, each with the public source to consult — are tracked in
# docs/assumptions_to_source.md. gb_v0_1 and gb_v1_0 stay FROZEN for provenance; this is a
# new file, never an in-place edit (see docs/assumption_library.md). Loaded via
# gridq.assumptions.load_assumptions("gb_v1_2").

metadata:
  market: GB
  version: gb_v1_2
  released: 2026-07-02
  currency: GBP
  notes: >-
    GB assumptions, debt-structure pass. Carries every gb_v1_0 value forward unchanged and
    adds four labelled placeholders: financing.debt_gearing_pct (illustrative, pending Sim's
    portfolio finance, B001), financing.credit_rate_tenor_policy (folded in from gb_v0_1 per
    D19), battery_opex.degradation_marginal_cost_gbp_per_mwh (illustrative throughput wear
    cost, pending OEM warranty schedule / M7) and battery_opex.parasitic_load_fraction_of_power
    (the BESS's own auxiliary draw, F-007). NOT confirmed — no quote on this release is
    bankable. gb_v0_1, gb_v1_0 and gb_v1_1 stay frozen for provenance. Strict superset of
    gb_v1_1: its D30 optional sections (availability / penalties / tnuos) are carried
    forward verbatim, so the W8 risk shapes read identically on this release.

