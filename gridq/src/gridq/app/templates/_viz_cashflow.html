{# Feature visual: the 25-year cashflow - annual free cashflow bars with a payback marker. Illustrative. #}
<div class="lp-viz">
  <div class="lp-viz__cap"><b>25-year cashflow</b><span class="lp-viz__tag">P50 · payback</span></div>
  <svg class="lp-bars" viewBox="0 0 460 230" role="img" aria-label="Annual free cashflow rising over 25 years with a payback marker">
    <defs>
      <linearGradient id="cfg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#33b377"/><stop offset="1" stop-color="var(--ok)"/>
      </linearGradient>
    </defs>
    {# baseline #}
    <line x1="14" y1="192" x2="446" y2="192" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>
    {# annual free-cashflow bars (illustrative, gently declining with degradation) #}
    <g fill="url(#cfg)">
      <rect x="20"  y="74"  width="18" height="118"/>
      <rect x="48"  y="77"  width="18" height="115"/>
      <rect x="76"  y="80"  width="18" height="112"/>
      <rect x="104" y="83"  width="18" height="109"/>
      <rect x="132" y="86"  width="18" height="106"/>
      <rect x="160" y="89"  width="18" height="103"/>
      <rect x="188" y="92"  width="18" height="100"/>
      <rect x="216" y="95"  width="18" height="97"/>
      <rect x="244" y="98"  width="18" height="94"/>
      <rect x="272" y="100" width="18" height="92"/>
      <rect x="300" y="103" width="18" height="89"/>
      <rect x="328" y="106" width="18" height="86"/>
      <rect x="356" y="108" width="18" height="84"/>
      <rect x="384" y="111" width="18" height="81"/>
      <rect x="412" y="113" width="18" height="79"/>
    </g>
    {# payback marker around year 7 #}
    <line x1="201" y1="40" x2="201" y2="206" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="4 4"/>
    <text x="206" y="52" fill="var(--accent-strong)" font-size="11" font-weight="700">payback ~6.8 yr</text>
    <text x="20" y="222" fill="rgba(255,255,255,0.45)" font-size="10">Year 1</text>
    <text x="404" y="222" fill="rgba(255,255,255,0.45)" font-size="10">Year 25</text>
  </svg>
</div>
