{# Feature visual: the revenue stack - firm priced floor vs gated upside. Decorative / illustrative. #}
<div class="lp-viz">
  <div class="lp-viz__cap"><b>Revenue stack</b><span class="lp-viz__tag">Firm floor · gated upside</span></div>
  <svg class="lp-stack" viewBox="0 0 460 230" role="img" aria-label="Revenue stack: a firm priced floor and a separate gated upside">
    <text x="0" y="26" fill="rgba(255,255,255,0.78)" font-size="12" font-weight="600">Priced floor</text>
    <g>
      <rect x="0" y="36" width="250" height="34" rx="6" fill="var(--ok)"/>
      <rect x="254" y="36" width="120" height="34" rx="6" fill="var(--ok)"/>
    </g>
    <text x="0" y="96" fill="rgba(255,255,255,0.78)" font-size="12" font-weight="600">Gated upside</text>
    <g>
      <rect x="0" y="106" width="120" height="34" rx="6" fill="var(--accent)"/>
      <rect x="124" y="106" width="58" height="34" rx="6" fill="var(--accent-strong)"/>
    </g>
    {# legend #}
    <g font-size="11" fill="rgba(255,255,255,0.62)">
      <rect x="0" y="176" width="11" height="11" rx="2" fill="var(--ok)"/><text x="18" y="186">Bill savings &amp; DUoS avoidance</text>
      <rect x="0" y="198" width="11" height="11" rx="2" fill="var(--ok)"/><text x="18" y="208">Capacity Market (de-rated)</text>
      <rect x="250" y="176" width="11" height="11" rx="2" fill="var(--accent)"/><text x="268" y="186">Flexibility / wholesale</text>
      <rect x="250" y="198" width="11" height="11" rx="2" fill="var(--accent-strong)"/><text x="268" y="208">Balancing (gated)</text>
    </g>
  </svg>
</div>
