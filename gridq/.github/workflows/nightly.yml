# GridQ nightly full suite (WP-PLAT-01): every test module, on main, with pass and fail counts
# published to the run's summary page and kept as a 90-day artifact (nightly-results.json).
#
# The full suite = the fast tier + the slow tier + every heavy module (.github/ci/run_tests.sh).
# The shards run in parallel; the report job sums their JUnit files. A shard that crashes or times
# out leaves no XML and is reported as missing, which fails the run: a lost shard never reads as
# zero tests.

name: GridQ nightly

on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC daily
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  TZ: UTC
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  POLARS_MAX_THREADS: "1"
  # One departure from requirements.txt, pinned to the repo .venv's version until the owner
  # updates the lock (measured 2026-11-16):
  # - openpyxl: a declared runtime dependency (pyproject.toml) the lock omits; .xlsx ingestion
  #   fails on the lock alone.
  # highspy is no longer a departure: D63 (2026-11-22) moved the lock to 1.15.1, the version the
  # golden pins were minted on (on the old lock pin the demo's bill.peak_import_after_kw solved
  # to 270.306 kW against the pinned 278.407). Installing it here a second time would hide a
  # future lock drift.
  LOCK_GAPS: openpyxl==3.1.5
  DEV_TOOLS: pytest==9.1.1 pytest-xdist==3.8.0 ruff==0.16.1 mypy==2.3.0 httpx==0.28.1

jobs:
  shard:
    name: ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard:
          - { name: fast-tier, cmd: "fast" }
          - { name: slow-tier, cmd: "slow" }
          - { name: test_determinism_golden, cmd: "module tests/test_determinism_golden.py" }
          - { name: test_app_demo, cmd: "module tests/test_app_demo.py" }
          - { name: test_app_charts_wiring, cmd: "module tests/test_app_charts_wiring.py" }
          - { name: test_app_auth_scoping, cmd: "module tests/test_app_auth_scoping.py" }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install (lock + dev tools)
        run: |
          python -m pip install --only-binary=:all: -r requirements.txt
          python -m pip install --only-binary=:all: $LOCK_GAPS $DEV_TOOLS
          python -m pip install --no-deps -e .
      - name: Run ${{ matrix.shard.name }}
        run: >
          .github/ci/run_tests.sh ${{ matrix.shard.cmd }} -q --durations=25
          --junitxml=junit-${{ matrix.shard.name }}.xml
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: junit-${{ matrix.shard.name }}
          path: junit-${{ matrix.shard.name }}.xml
          if-no-files-found: ignore
          retention-days: 14

  report:
    name: publish counts
    if: ${{ always() }}
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          merge-multiple: true
      - name: Sum the shards
        run: |
          {
            echo "## GridQ nightly full suite: $(date -u +%Y-%m-%dT%H:%MZ), commit ${GITHUB_SHA::7}"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          python .github/ci/junit_summary.py summary.md nightly-results.json \
            junit-fast-tier.xml junit-slow-tier.xml junit-test_determinism_golden.xml junit-test_app_demo.xml \
            junit-test_app_charts_wiring.xml junit-test_app_auth_scoping.xml \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: nightly-results
          path: |
            nightly-results.json
            summary.md
          retention-days: 90
