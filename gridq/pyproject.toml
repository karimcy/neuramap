[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridq"
version = "0.0.1"
description = "GridQ — behind-the-meter BESS sizing & underwriting engine (Product Engineer layer)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Neura Product Engineering (Olly)" }]
keywords = ["bess", "underwriting", "energy", "behind-the-meter"]

# Runtime dependencies. The solver stack (linopy/highspy) was deferred from v1 (D3) while only the
# mock engine existed; it lands here at the real-engine milestone (W4-1 / D18) because the default
# production engine (gridq.optimisation.MilpEngine) needs it to dispatch. xarray is pinned < 2025
# because linopy's expression layer is incompatible with the 2025+/2026 xarray Dataset constructor;
# this pin is part of the deterministic-reproduction contract (see D18).
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.0",
    "openpyxl>=3.1",  # Excel (.xlsx/.xls) half-hourly ingestion (M0); read-only via pandas.
    "numpy>=1.26",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12",
    "linopy>=0.5,<0.6",
    "highspy>=1.7",
    "xarray>=2024.2,<2025",
]

[project.optional-dependencies]
# The demo web shell (issue 013 / M8 UI). Optional: the core engine, CLI and tests
# do not need it. Install with `pip install -e ".[app]"`; run with `python -m gridq.app`.
app = [
    "fastapi>=0.110",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "uvicorn>=0.29",
    # Accounts: Google OAuth (Authlib, the audited client) + signed session cookies.
    "authlib>=1.7",
    "itsdangerous>=2.1",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "gridq[app]",
    "httpx>=0.27",
]

[project.scripts]
gridq = "gridq.cli:main"
gridq-team-sync = "gridq.dev.team_sync:main"
gridq-review-gates = "gridq.dev.review_gates:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
# 3.12 = the deployment floor (Dockerfile python:3.12-slim); numpy ≥2.5 stubs use PEP 695 `type`
# statements, which mypy rejects under a 3.11 target.
python_version = "3.12"
mypy_path = "src"
packages = ["gridq"]
ignore_missing_imports = true
